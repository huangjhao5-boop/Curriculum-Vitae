  <style>
    /* =========================================
       1. 現代美學設計系統 (Modern Design System)
       ========================================= */
    :root {
      --primary: #0f766e;
      --primary-light: #14b8a6;
      --primary-dark: #115e59;
      --primary-gradient: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #14b8a6 100%);
      
      --plan-my: #6366f1;
      --plan-parent: #f59e0b;
      --skill-color: #10b981;
      --achieve-color: #f97316;
      --birth-color: #ec4899;
      --diary-color: #3b82f6;
      
      --bg-color: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(226, 232, 240, 0.85);
      --glass-bg: rgba(255, 255, 255, 0.85);
      
      --text-main: #1e293b;
      --text-sub: #64748b;
      --text-muted: #94a3b8;
      
      --border: #e2e8f0;
      --border-focus: #0d9488;
      --danger: #ef4444;
      --success: #10b981;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    html, body {
      font-family: 'Inter', 'Noto Sans TC', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
      letter-spacing: -0.01em;
      min-height: 100vh;
      min-height: 100dvh;
    }
    *, *::before, *::after { box-sizing: inherit; }
    
    .container { max-width: 1060px; margin: 0 auto; padding: 20px 16px; padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
    
    /* Modern Glass Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-top: 0;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Stats & Radar Chart */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-box {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      padding: 16px 12px;
      border-radius: var(--radius-sm);
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .stat-box:hover { transform: translateY(-2px); border-color: var(--primary-light); }
    .stat-val { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.02em; }
    .stat-label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-top: 4px; }
    .chart-container { position: relative; height: 280px; width: 100%; margin-bottom: 10px; }

    /* Buttons */
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary-gradient); color: white; }
    .btn-primary:hover { box-shadow: 0 4px 12px rgba(15, 118, 110, 0.35); }
    .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fecaca; }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
    .btn-google { background: #ffffff; color: #334155; border: 1px solid #cbd5e1; }
    .btn-lang { background: #ffffff; color: var(--primary-dark); border: 1px solid var(--border); font-size: 12px; padding: 6px 12px; border-radius: var(--radius-full); font-weight: 700; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }

    /* Inputs */
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      margin-bottom: 14px;
      background: #ffffff;
      color: var(--text-main);
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    input:disabled, select:disabled, textarea:disabled { background-color: #f8fafc; color: var(--text-muted); cursor: not-allowed; }
    input[type="checkbox"], input[type="radio"] { transform: scale(1.2); margin-right: 8px; cursor: pointer; width: auto; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .hidden { display: none !important; }

    /* Header with Blur */
    .header {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 24px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: var(--primary-dark);
    }
    .sync-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: #f1f5f9;
      border: 1px solid var(--border);
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .sync-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .sync-dot.syncing { background: #8b5cf6; animation: blink 1s infinite; box-shadow: 0 0 8px #8b5cf6; }
    @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } }

    /* Modern Segmented Pill Tabs (完全解決切邊問題) */
    .tabs-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding: 8px 16px 8px 8px;
      background: #f1f5f9;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scroll-snap-type: x proximity;
    }
    .tab {
      padding: 10px 18px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: var(--radius-sm);
      white-space: nowrap;
      flex-shrink: 0;
      scroll-snap-align: start;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab:hover { color: var(--primary); background: rgba(255,255,255,0.6); }
    .tab.active {
      color: var(--primary-dark);
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-weight: 700;
    }

    /* Timeline Filter Chips */
    .timeline-filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .timeline-filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #f1f5f9;
      color: var(--text-sub);
      border: 1px solid var(--border);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.3);
    }

    /* Timeline & Lists */
    .list-item {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .list-item:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }
    .item-content { flex: 1; cursor: pointer; }
    .item-meta { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; display: flex; gap: 8px; align-items: center;}
    .item-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; color: var(--text-main); }
    .item-desc { font-size: 13.5px; color: #475569; line-height: 1.5; white-space: pre-wrap; }
    
    .tag { padding: 3px 10px; border-radius: var(--radius-full); font-size: 11px; color: white; font-weight: 700; letter-spacing: 0.02em; }
    .badge-success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; padding: 3px 10px; border-radius: var(--radius-full); font-size: 11px; font-weight: 700; }

    .timeline-dual { position: relative; margin: 20px 0; padding: 10px 0; }
    .timeline-dual::after { content: ''; position: absolute; width: 4px; background: linear-gradient(180deg, #cbd5e1 0%, #e2e8f0 100%); top: 0; bottom: 0; left: 50%; transform: translateX(-50%); border-radius: 4px; }
    .tl-container { padding: 12px 32px; position: relative; width: 50%; box-sizing: border-box; }
    .tl-left { left: 0; text-align: right; }
    .tl-right { left: 50%; text-align: left; }
    .tl-dot { position: absolute; width: 16px; height: 16px; background-color: white; top: 22px; border-radius: 50%; z-index: 2; border: 4px solid; box-shadow: 0 0 0 3px rgba(255,255,255,0.8); }
    .tl-left .tl-dot { right: -8px; }
    .tl-right .tl-dot { left: -8px; }
    .tl-content { padding: 18px; background: white; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; }
    .tl-content:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

    .photo-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; cursor: zoom-in; transition: transform 0.2s; }
    .photo-thumb:hover { transform: scale(1.05); }
    .profile-photo-area { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px; border: 2px dashed var(--border); border-radius: var(--radius); background: #f8fafc; }
    .profile-photo-img { width: 110px; height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; cursor: zoom-in; box-shadow: var(--shadow-md); }

    /* Life Progress Hero */
    .life-hero {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 45%, #14b8a6 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.4);
      position: relative;
      overflow: hidden;
    }
    .life-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
    }
    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.25);
      height: 12px;
      border-radius: 12px;
      margin-top: 16px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #fde047 0%, #4ade80 50%, #38bdf8 100%);
      border-radius: 12px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(253, 224, 71, 0.5);
    }

    /* PWA Install Banner */
    .pwa-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      padding: 14px 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }

    /* Floating Action Button (FAB) */
    .fab-btn {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      right: calc(28px + env(safe-area-inset-right, 0px));
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.45);
      border: none;
      cursor: pointer;
      z-index: 99;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fab-btn:hover { transform: scale(1.1) rotate(90deg); }

    /* Canvas Floating Controls */
    .canvas-control-bar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      z-index: 10;
    }
    .canvas-ctrl-btn {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }
    .canvas-ctrl-btn:hover { background: #f1f5f9; color: var(--primary); }

    /* Image Viewer (Lightbox) */
    .image-viewer-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      min-height: 100vh;
      min-height: 100dvh;
      background: rgba(0,0,0,0.88); 
      backdrop-filter: blur(8px); 
      z-index: 3000; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      cursor: zoom-out; 
    }
    .image-viewer-img { max-width: 92%; max-height: 92%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); object-fit: contain; }

    /* Export Selector */
    .export-check-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #f8fafc; margin-bottom: 10px; }
    .export-check-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 13px; }
    .export-check-item input[type="checkbox"] { margin: 0 8px 0 0; width: 18px; height: 18px; min-width: 18px; min-height: 18px; }

    /* Overlays & Loaders */
    .overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      min-height: 100vh;
      min-height: 100dvh;
      background: rgba(15, 23, 42, 0.65); 
      backdrop-filter: blur(6px); 
      z-index: 2000; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow-y: auto; 
      padding: 20px;
    }
    .dialog-box { background: white; padding: 32px; border-radius: var(--radius-lg); width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); margin:auto; }
    .modal-box { background: white; padding: 28px; border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .custom-dialog-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      min-height: 100vh;
      min-height: 100dvh;
      background: rgba(15, 23, 42, 0.65); 
      backdrop-filter: blur(6px); 
      z-index: 9999; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
    }
    .custom-dialog-box { background: white; padding: 28px; border-radius: var(--radius-lg); width: 100%; max-width: 380px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loader-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 44px; height: 44px; animation: spin 0.8s linear infinite; margin: 20px auto; }

    /* Toast Notification System */
    #toast-container {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 90vw;
    }
    .toast-item {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.94);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.35), 0 8px 10px -6px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: toastSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
      cursor: pointer;
    }
    .toast-item.toast-success { border-left: 4px solid #10b981; }
    .toast-item.toast-info { border-left: 4px solid #6366f1; }
    .toast-item.toast-warning { border-left: 4px solid #f59e0b; }
    .toast-item.hiding {
      opacity: 0;
      transform: translateY(12px) scale(0.96);
    }
    @keyframes toastSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Milestone Badge & Highlighting */
    .milestone-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #92400e;
      border: 1px solid #f59e0b;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }
    .tl-content.is-milestone {
      border-left: 4px solid #f59e0b !important;
      background: linear-gradient(to right, rgba(254, 243, 199, 0.35), #ffffff);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.15);
    }

    this.state.view = 'login';
    this.state.loginProfileId = '';
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      this.state.deferredPrompt = e;
      this.state.showPwaBanner = true;
      this.render();
    });

    this.render();
  },

  promptPwaInstall() {
    if (this.state.deferredPrompt) {
      this.state.deferredPrompt.prompt();
      this.state.deferredPrompt.userChoice.then((choice) => {
        this.state.showPwaBanner = false;
        this.state.deferredPrompt = null;
        this.render();
      });
    }
  },

  trackEvent(eventName, eventParams = {}) {
      try {
          if (typeof gtag === 'function') gtag('event', eventName, eventParams);
      } catch(e) {}
  },

  changeTab(tabId) {
      this.state.activeTab = tabId;
      this.trackEvent('tab_view', { tab_name: tabId });
      this.render();
  },

  setTimelineFilter(filter) {
      this.state.timelineFilter = filter;
      this.render();
  },

  getLocalTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
  },

  toJapaneseEra(year) {
      if (!year) return '';
      const y = parseInt(year);
      if (this.data.settings.printEra === 'western') return y;
      
      if (y >= 2019) {
          const reiwa = y - 2018; return reiwa === 1 ? `令和元` : `令和${reiwa}`;
      } else if (y >= 1989) {
          const heisei = y - 1988; return heisei === 1 ? `平成元` : `平成${heisei}`;
      } else if (y >= 1926) {
          const showa = y - 1925; return showa === 1 ? `昭和元` : `昭和${showa}`;
      }
      return y;
  },

  loadData() {
    try {
      const raw = localStorage.getItem(this.DB_KEY);
      if (raw) {
          this.data = JSON.parse(raw);
          if (!this.data.settings) this.data.settings = {};
          if (!this.data.settings.mainProfileId) this.data.settings.mainProfileId = 'parent_self';
          if (!this.data.settings.printEra) this.data.settings.printEra = 'western';
          if (!this.data.settings.lang) this.data.settings.lang = 'zh';

          Object.values(this.data.profiles).forEach(p => {
             if(!p.diary) p.diary = []; 
             if(!p.plans) p.plans = [];
             if(!p.achievements) p.achievements = []; 
             if(p.isClaimed === undefined) p.isClaimed = false;
             if(!p.shareCode) p.shareCode = '';
             
             if(!p.basic) p.basic = {};
             if(p.basic.desiredConditions === undefined) p.basic.desiredConditions = '';
             if(p.basic.contactAddress === undefined) p.basic.contactAddress = '';
             if(p.basic.contactPhone === undefined) p.basic.contactPhone = '';
             if(p.basic.contactPostalCode === undefined) p.basic.contactPostalCode = '';
             if(p.basic.motivation === undefined) p.basic.motivation = '';
             if(p.basic.motto === undefined) p.basic.motto = '';
             
             const fixAuthor = (author) => {
                 if (this.data.profiles[author]) return author; 
                 if (author === 'parent' || author === 'parent_self') return this.data.settings.mainProfileId || 'parent_self';
                 if (author === 'child' || author === 'self' || author === 'child_self' || author === 'subject') return p.id;
                 return this.data.settings.mainProfileId || 'parent_self';
             };

             p.plans.forEach(pl => { 
                 if(!pl.status) pl.status = 'active'; 
                 pl.author = fixAuthor(pl.author);
             });
             p.diary.forEach(d => {
                 if(!d.visibility) d.visibility = 'visible';
                 d.author = fixAuthor(d.author);
             });
          });
      }
    } catch(e) { console.error("Load Error", e); }
  },

  saveData() {
    try {
      if(!window.CloudSync?.isPulling) {
          const p = this.getProfile();
          if(p) p._lastUpdate = Date.now();
      }
      localStorage.setItem(this.DB_KEY, JSON.stringify(this.data));
      
      if(window.CloudSync?.isLoggedIn && !window.CloudSync.pauseSync && !window.CloudSync.isPulling) {
          clearTimeout(window.CloudSync.syncTimeout);
          window.CloudSync.syncTimeout = setTimeout(() => {
              this.triggerBackgroundSync();
          }, 800);
      }
    } catch (e) { this.showAlert('ストレージ不足です。画像を減らしてください。'); }
  },

  isLocalDefault() {
      const keys = Object.keys(this.data.profiles);
      if (keys.length > 1) return false;
      const p = this.data.profiles['parent_self'];
      if (!p || p.name !== '本人') return false;
      if (p.history.length > 0 || p.skills.length > 0 || p.plans.length > 0 || p.achievements.length > 0 || p.diary.length > 0) return false;
      if (p.basic.birthday || p.basic.photo || p.basic.phone || p.basic.email || p.basic.address) return false;
      return true;
  },

  resolveConflict(choice) {
      if (choice === 'cloud') {
          this.data = this.state.dialog.cloudData;
          localStorage.setItem(this.DB_KEY, JSON.stringify(this.data));
          window.CloudSync.pauseSync = false;
          this.state.dialog = null;
          this.showAlert("クラウドのデータで復元しました。再読み込みします。");
          setTimeout(() => location.reload(), 1000);
      } else if (choice === 'local') {
          window.CloudSync.pauseSync = false;
          this.state.dialog = null;
          this.triggerBackgroundSync();
          this.showAlert("ローカルのデータでクラウドを上書きしました。");
      }
  },

  async triggerBackgroundSync() {
    if(this.state.isSyncing) return;
    this.state.isSyncing = true; this.updateHeaderSyncUI();
    
    window.CloudSync.isPushingMain = true;
    this.data.settings.lastSync = Date.now();
    const res = await window.CloudSync.backup(this.data);
    
    const sharedPromises = Object.values(this.data.profiles)
        .filter(p => p.shareCode)
        .map(async p => {
            window.CloudSync.isPushingShared = p.shareCode;
            try { await window.CloudSync.updateSharedProfile(p); } catch(e) {}
            setTimeout(() => window.CloudSync.isPushingShared = null, 1500);
        });
    await Promise.all(sharedPromises);

    setTimeout(() => window.CloudSync.isPushingMain = false, 1500);
    this.state.isSyncing = false;
    if(res.success) { localStorage.setItem(this.DB_KEY, JSON.stringify(this.data)); }
    this.updateHeaderSyncUI();
  },

  getProfile() { return this.data.profiles[this.state.activeProfileId] || this.data.profiles['parent_self']; },

  showAlert(message) { this.state.dialog = { type: 'alert', message, onConfirm: () => { this.state.dialog = null; this.render(); } }; this.render(); },
  showToast(message, type = 'success', duration = 2800) {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    const icon = type === 'success' ? '✨' : (type === 'warning' ? '⚠️' : '💡');
    toast.className = `toast-item toast-${type}`;
    toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
    toast.onclick = () => {
      toast.classList.add('hiding');
      setTimeout(() => toast.remove(), 250);
    };
    container.appendChild(toast);
    setTimeout(() => {
      if (toast.parentNode) {
        toast.classList.add('hiding');
        setTimeout(() => toast.remove(), 250);
      }
    }, duration);
  },
  showConfirm(message, onConfirmCallback) { this.state.dialog = { type: 'confirm', message, onConfirm: () => { this.state.dialog = null; onConfirmCallback(); this.render(); }, onCancel: () => { this.state.dialog = null; this.render(); } }; this.render(); },
  showPrompt(message, onConfirmCallback) { this.state.dialog = { type: 'prompt', message, onConfirm: (val) => { this.state.dialog = null; if(val !== null) onConfirmCallback(val); this.render(); }, onCancel: () => { this.state.dialog = null; this.render(); } }; this.render(); },

  async hashPassword(pwd, saltHex) {
    if (!pwd) return { hash: '', salt: '' };
    const salt = saltHex || Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join('');
    const encoder = new TextEncoder();
    const data = encoder.encode(pwd + ':' + salt);
    const hashBuf = await crypto.subtle.digest('SHA-256', data);
    const hash = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    return { hash, salt };
  },

  async verifyPassword(inputPwd, storedHash, storedSalt) {
    if (!storedHash) return true;
    if (!storedSalt) {
      // Legacy unhashed plain password backward compatibility
      return inputPwd === storedHash;
    }
    const { hash } = await this.hashPassword(inputPwd, storedSalt);
    return hash === storedHash;
  },

  async executeLogin() {
    const roleId = this.state.loginProfileId;
    if(!roleId) return;
    
    const targetProfile = this.data.profiles[roleId];
    if(!targetProfile) return;

    const storedHash = (targetProfile.passwordHash || targetProfile.password || '').trim();
    const storedSalt = (targetProfile.passwordSalt || '').trim();

    if (storedHash) {
        const input = document.getElementById('login-pwd');
        if (!input) return; 
        const isMatch = await this.verifyPassword(input.value, storedHash, storedSalt);
        if (!isMatch) { 
          this.showAlert('パスワードが正しくありません。'); 
          return; 
        }
        // Upgrade legacy unhashed password automatically upon successful login
        if (!targetProfile.passwordHash && targetProfile.password) {
          const { hash, salt } = await this.hashPassword(input.value);
          targetProfile.passwordHash = hash;
          targetProfile.passwordSalt = salt;
          delete targetProfile.password;
          this.saveData();
        }
    }
    
    if (this.networkInstance) {
        this.networkInstance.destroy();
        this.networkInstance = null;
    }

    this.state.activeProfileId = roleId;
    this.state.view = 'app';
    this.trackEvent('login_success', { role: roleId === this.data.settings.mainProfileId ? 'main' : 'child' });
    this.render();
  },

  async setProfilePassword(profileId, newPwd) {
    const prof = this.data.profiles[profileId];
    if (!prof) return;
    const clean = (newPwd || '').trim();
    if (!clean) {
      delete prof.password;
      delete prof.passwordHash;
      delete prof.passwordSalt;
      this.saveData();
      this.showAlert('パスワードを解除しました。');
      this.render();
      return;
    }
    const { hash, salt } = await this.hashPassword(clean);
    prof.passwordHash = hash;
    prof.passwordSalt = salt;
    delete prof.password; // 零敏感明文上雲與儲存
    this.saveData();
    this.showAlert('パスワードを安全に更新しました。(Web Crypto SHA-256 + Salt 加塩暗号化)');
    this.render();
  },
  
  logout() { 
    this.state.view = 'login'; 
    this.state.loginProfileId = ''; 
    this.render(); 
  },

  addChild() {
    this.showPrompt("お子様の名前を入力：", (name) => {
      if(!name || !name.trim()) return;
      const newId = 'child_' + Date.now();
      this.data.profiles[newId] = {
        id: newId, name: name.trim(), role: 'child', isClaimed: false, shareCode: '',
        basic: { furigana: '', gender: '', birthday: '', postalCode: '', address: '', phone: '', email: '', contactPostalCode:'', contactAddress:'', contactPhone:'', desiredConditions:'', motivation: '', photo: null },
        history: [], skills: [], achievements: [], events: [], plans: [], diary: []
      };
      this.state.activeProfileId = newId; this.saveData();
      this.trackEvent('add_child_profile');
      this.showConfirm("お子様専用のパスワードを設定しますか？", () => {
         this.showPrompt("パスワードを入力：", async (p) => { 
           if(p && p.trim()){ 
             await this.setProfilePassword(newId, p.trim());
           } 
         });
      });
    });
  },

  deleteProfile(id) {
    this.showConfirm(`「${this.data.profiles[id].name}」のプロフィールを端末から削除しますか？\n※他の端末で共有されているデータは消えません。`, () => {
        if(window.CloudSync?.unsubShared?.[this.data.profiles[id].shareCode]) {
            window.CloudSync.unsubShared[this.data.profiles[id].shareCode]();
            delete window.CloudSync.unsubShared[this.data.profiles[id].shareCode];
        }
        delete this.data.profiles[id];
        
        const mainId = this.data.settings.mainProfileId || 'parent_self';
        this.state.activeProfileId = mainId;
        this.state.loginProfileId = mainId;
        
        this.saveData();
        this.trackEvent('delete_profile');
        this.render();
    });
  },

  switchProfile(id) { 
      if(this.data.profiles[id]) { 
          if (this.networkInstance) {
              this.networkInstance.destroy();
              this.networkInstance = null;
          }
          this.state.activeProfileId = id; 
          this.render(); 
      } 
  },
  
  updateBasic(field, value) { 
    if(field === 'birthday' && value) {
        const todayStr = this.getLocalTodayString();
        if(value > todayStr) { this.showAlert("未来の日付は設定できません。"); return; }
    }
    this.getProfile().basic[field] = value; this.saveData(); this.render();
  },

  updateSetting(field, value) {
      this.data.settings[field] = value; this.saveData(); this.render();
  },
  
  updateName(value) { this.getProfile().name = value; this.saveData(); this.render(); },

  viewImage(src) { if(!src) return; this.state.viewImageSrc = src; this.render(); },
  closeImageViewer() { this.state.viewImageSrc = null; this.render(); },

  processImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 400; let w = img.width, h = img.height;
        if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  },

  uploadPhoto(target, category = null, itemId = null) {
    const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.onchange = (e) => {
      const file = e.target.files[0]; if(!file) return;
      this.processImage(file, (data) => {
        if(target === 'basic') this.getProfile().basic.photo = data;
        else { const it = this.getProfile()[category].find(i => i.id === itemId); if(it) it.photo = data; }
        this.saveData(); this.render();
      });
    };
    input.click();
  },

  openModal(category, itemId = null) { this.state.modalContext = { category, itemId }; this.render(); },
  closeModal() { this.state.modalContext = null; this.render(); },
  
  saveModalItem() {
    const ctx = this.state.modalContext; if(!ctx) return;
    const p = this.getProfile(); const isNew = ctx.itemId === null;
    const id = isNew ? 'item_' + Date.now() : ctx.itemId;
    let itemData = { id };
    
    const myId = this.state.loginProfileId;

    if (ctx.category === 'diary') {
        const dStr = document.getElementById('mod-date').value;
        if(!dStr) { this.showAlert("日付を入力してください。"); return; }
        itemData.date = dStr; itemData.year = parseInt(dStr.split('-')[0]); itemData.month = parseInt(dStr.split('-')[1]);
        itemData.title = document.getElementById('mod-title').value; 
        if(!itemData.title.trim()) { this.showAlert("内容を入力してください。"); return; }
        itemData.desc = ''; 
        itemData.visibility = document.getElementById('mod-visibility').value;
        
        if(isNew) { itemData.author = myId; }
        else { const ex = p.diary.find(i => i.id === id); itemData.author = ex.author || myId; }
    } else {
        itemData.year = parseInt(document.getElementById('mod-year').value) || '';
        itemData.month = parseInt(document.getElementById('mod-month').value) || '';
        itemData.title = document.getElementById('mod-title').value;
        itemData.desc = document.getElementById('mod-desc').value;
        itemData.stage = document.getElementById('mod-stage').value;
        
        if(itemData.year && itemData.year > 2100) { this.showAlert("正しい西暦を入力してください。"); return; }
        if(ctx.category === 'history') itemData.eduStatus = document.getElementById('mod-edu-status').value;
        if(ctx.category === 'skills') itemData.dim = document.getElementById('mod-skill-dim').value;
        if(ctx.category === 'plans') {
           itemData.visibility = document.getElementById('mod-visibility').value;
           if(isNew) { itemData.author = myId; itemData.status = 'active'; } 
           else { const ex = p.plans.find(i => i.id === id); itemData.author = ex.author || myId; itemData.status = ex.status; }
        }
        const milestoneChk = document.getElementById('mod-milestone');
        if (milestoneChk) {
           itemData.isMilestone = !!milestoneChk.checked;
        }
    }
    
    if (!p[ctx.category]) p[ctx.category] = [];
    
    if(!isNew) { 
        const exist = p[ctx.category].find(i => i.id === id); 
        if(exist && exist.photo) itemData.photo = exist.photo; 
    }
    
    if(isNew) {
        p[ctx.category].push(itemData);
        this.trackEvent('add_item', { category: ctx.category });
    } else { 
        const idx = p[ctx.category].findIndex(i => i.id === id); 
        if(idx !== -1) p[ctx.category][idx] = { ...p[ctx.category][idx], ...itemData }; 
    }
    
    this.saveData(); this.closeModal(); this.render();
    this.showToast(this.t('toastSaved'), 'success');
  },

  deleteItem(category, itemId) { this.showConfirm('項目を削除しますか？', () => { this.getProfile()[category] = this.getProfile()[category].filter(i => i.id !== itemId); this.saveData(); this.render(); this.showToast('已刪除項目', 'info'); }); },
  deleteItemPhoto(cat, id) { this.showConfirm("写真を削除しますか？", () => { const i=this.getProfile()[cat].find(x=>x.id===id); if(i) i.photo=null; this.saveData(); this.render(); this.showToast('已刪除照片', 'info'); }); },

  toggleVisibility(category, itemId) {
      const item = this.getProfile()[category].find(i => i.id === itemId);
      if(item) {
          item.visibility = (item.visibility === 'visible') ? 'hidden' : 'visible';
          this.saveData();
          this.render();
          this.showToast(item.visibility === 'visible' ? '🔓 已設為公開 (親友共享)' : '🔒 已設為私密 (僅自己可見)', 'info');
      }
  },

  triggerCompletePlan(planId) { 
    const lang = this.data.settings.lang || 'zh';
    this.state.dialog = { 
      type: 'complete_plan', 
      planId: planId, 
      message: lang === 'zh' 
        ? '🎉 恭喜達成目標！\n這是一段努力的成果，請選擇要將此項成就收錄於哪個生涯類別：' 
        : '🎉 目標達成おめでとうございます！\nこの実績をどのカテゴリに記録しますか？' 
    }; 
    this.render(); 
  },
  confirmCompletePlan(planId, targetCategory) {
    const p = this.getProfile(); const plan = p.plans.find(i => i.id === planId);
    if(plan) {
      plan.status = 'completed'; 
      const cleanTitle = plan.title.replace('[AI提案] ', '').replace('[AI 技能目標] ', '');
      const newItem = { 
        id: 'item_' + Date.now(), 
        year: plan.year || new Date().getFullYear(), 
        month: plan.month || (new Date().getMonth() + 1), 
        title: cleanTitle, 
        desc: `【目標達成】\n` + (plan.desc || ''), 
        stage: plan.stage, 
        photo: plan.photo,
        isMilestone: !!plan.isMilestone
      };
      
      if(!p[targetCategory]) p[targetCategory] = []; 
      if(targetCategory === 'history') newItem.eduStatus = '卒業';
      if(targetCategory === 'skills') newItem.dim = '専門資格'; 
      p[targetCategory].push(newItem);
      
      const pId = this.state.activeProfileId;
      if (this.state.skillTreeCaches[pId]) {
          ['A', 'B'].forEach(mode => {
              if (this.state.skillTreeCaches[pId][mode]) {
                  this.state.skillTreeCaches[pId][mode].data.nodes.forEach(node => {
                      if(node.group === 'pending' && (cleanTitle.toLowerCase().includes(node.label.toLowerCase()) || node.label.toLowerCase().includes(cleanTitle.toLowerCase()))) {
                          node.group = 'acquired';
                      }
                  });
              }
          });
      }

      this.saveData();
      this.trackEvent('complete_plan', { category_saved: targetCategory });
      const lang = this.data.settings.lang || 'zh';
      this.showToast(
        lang === 'zh' ? '🎉 恭喜達成目標！已榮耀記錄至生涯成就！' : '🎉 目標達成！実績に記録しました！',
        'success',
        3500
      );
    }
    this.state.dialog = null; this.render();
  },

  grantAccess(category, itemId) { const item = this.getProfile()[category].find(i => i.id === itemId); if(item) { item.visibility = 'visible'; this.saveData(); this.render(); } },
  requestAccess(category, itemId) { const item = this.getProfile()[category].find(i => i.id === itemId); if(item) { item.visibility = 'requested'; this.saveData(); this.render(); this.showAlert('閲覧リクエストを送信しました。'); } },

  /* === 家族共有コード発行 & データインポート === */
  async generateShareCode() {
    const p = this.getProfile();
    if (!window.CloudSync?.isLoggedIn) {
        this.showAlert("共有コードを発行するには、先にGoogleアカウント連携を行ってください。");
        return;
    }
    if (!p.shareCode) {
        p.shareCode = 'LR-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }
    const res = await window.CloudSync.createShareLink(p);
    if (res.success) {
        this.saveData();
        window.CloudSync.listenToSharedProfiles();
        this.showAlert(`🎉 共有コードを発行しました！\n\n【 ${p.shareCode} 】\n\n相手の端末でこのコードを入力して受け取ると、自動同期が開始されます。`);
    } else {
        this.showAlert("共有コードの発行に失敗しました: " + (res.msg || '不明なエラー'));
    }
  },

  async importSharedProfile(code) {
    if (!code || !code.trim()) {
        this.showAlert("共有コードを入力してください。");
        return;
    }
    const cleanCode = code.trim().toUpperCase();
    if (!window.CloudSync?.isLoggedIn) {
        this.showAlert("共有データを受け取るには、先にGoogleアカウント連携を行ってください。");
        return;
    }
    this.state.dialog = { type: 'loading', message: `共有コード【${cleanCode}】を照合中...` };
    this.render();

    const res = await window.CloudSync.fetchSharedProfile(cleanCode);
    this.state.dialog = null;

    if (res.success && res.data) {
        const remoteData = res.data;
        const newId = 'shared_' + Date.now();
        this.data.profiles[newId] = {
            ...remoteData,
            id: newId,
            shareCode: cleanCode,
            isClaimed: true
        };
        this.saveData();
        window.CloudSync.listenToSharedProfiles();
        this.showAlert(`✅ 「${remoteData.name}」のデータを受信しました！一覧から切り替えられます。`);
        this.render();
    } else {
        this.showAlert("有効な共有データが見つかりませんでした。コードを確認してください。");
    }
  },

  async claimInheritedProfile(code, isIndependent) {
    if (!code || !code.trim()) {
      this.showAlert(this.data.settings.lang==='zh' ? "請輸入父母給您的傳承碼！" : "継承コードを入力してください。");
      return;
    }
    const cleanCode = code.trim().toUpperCase();
    
    // 優先在本地尋找是否已有該傳承碼檔案
    let foundProfile = Object.values(this.data.profiles).find(p => (p.shareCode || '').toUpperCase() === cleanCode);
    
    // 若本地無，且雲端已登入，嘗試自雲端拉取
    if (!foundProfile && window.CloudSync?.isLoggedIn) {
      this.state.dialog = { type: 'loading', message: `傳承代碼【${cleanCode}】照合中...` };
      this.render();
      const res = await window.CloudSync.fetchSharedProfile(cleanCode);
      this.state.dialog = null;
      if (res.success && res.data) {
        const newId = 'inherited_' + Date.now();
        this.data.profiles[newId] = {
          ...res.data,
          id: newId,
          shareCode: cleanCode
        };
        foundProfile = this.data.profiles[newId];
      }
    }

    if (!foundProfile) {
      this.showAlert(this.data.settings.lang==='zh' ? "找不到對應的傳承檔案。請確認代碼是否正確，或先在雲端登入以利跨裝置接收。" : "該当する継承データが見つかりませんでした。コードをご確認いただくか、Google連携をお試しください。");
      return;
    }

    // 標記為本人已正式獨立繼承的成年檔案
    foundProfile.role = 'claimed_adult';
    foundProfile.isClaimed = true;
    foundProfile.inheritedAt = Date.now();
    foundProfile.claimedAsSelf = true;

    if (isIndependent) {
      this.data.settings.mainProfileId = foundProfile.id;
    }
    this.state.activeProfileId = foundProfile.id;
    this.state.loginProfileId = foundProfile.id;
    this.state.showInheritModal = false;
    this.state.view = 'app';
    this.saveData();

    if (window.CloudSync?.listenToSharedProfiles) {
      window.CloudSync.listenToSharedProfiles();
    }

    this.showToast(this.t('handoverSuccessToast'), 'success', 5000);
    this.render();
  },

【JSON出力形式】（Markdownのコードブロックなし、純粋なJSON文字列のみ出力）
{

}

ノード数は8〜15個程度にし、論理的にedgesで繋いでください。`;

      try {
          let lastError = null;
          let treeData = null;
          let successfulModel = null;

          // 1. Try server-side API proxy first (using server GEMINI_API_KEY)
          try {
              const serverResp = await fetch('/api/skill-tree', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      prompt: prompt,
                      model: this.getGeminiModel(),
                      apiKey: apiKey || undefined
                  })
              });
              if (serverResp.ok) {
                  const serverJson = await serverResp.json();
                  if (serverJson.success && serverJson.treeData) {
                      treeData = serverJson.treeData;
                      successfulModel = serverJson.modelUsed || 'Gemini Server';
                  }
              } else {
                  const errJson = await serverResp.json().catch(() => ({}));
                  if (errJson.error) {
                      lastError = new Error(errJson.error);
                  }
              }
          } catch (srvErr) {
              console.warn('[AI Skill Tree] Server API route unavailable, checking client fallback...', srvErr);
          }

          // 2. Client fallback if user provided direct key and server didn't succeed
          if (!treeData && apiKey) {
              const candidateModels = [
                  this.getGeminiModel(),
                  'gemini-2.5-flash',
                  'gemini-1.5-flash',
                  'gemini-2.0-flash'
              ];
              const modelsToTry = [...new Set(candidateModels.filter(Boolean))];
              
              for (const modelName of modelsToTry) {
                  try {
                      console.log(`[AI Skill Tree] Trying client direct model: ${modelName}...`);
                      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`, {
                          method: 'POST',
                          headers: { 
                              'Content-Type': 'application/json',
                              'X-goog-api-key': apiKey
                          },
                          body: JSON.stringify({ 
                              contents: [{ parts: [{ text: prompt }] }], 
                              generationConfig: { responseMimeType: "application/json" } 
                          })
                      });
                      
                      const result = await resp.json();
                      if (!resp.ok) {
                          const errDetail = result.error?.message || `HTTP ${resp.status} Error`;
                          lastError = new Error(`[${modelName}] ${errDetail}`);
                          continue;
                      }
                      
                      if (!result.candidates || result.candidates.length === 0) {
                          lastError = new Error(`[${modelName}] API はコンテンツを返しませんでした。`);
                          continue;
                      }

                      let rawText = result.candidates[0].content.parts[0].text.trim();
                      if (rawText.startsWith('```')) {
                          rawText = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/\s*```$/, '');
                      }

                      treeData = JSON.parse(rawText);
                      successfulModel = modelName;
                      break;
                  } catch(modelErr) {
                      lastError = modelErr;
                      console.warn(`[AI Skill Tree] Attempt with ${modelName} failed:`, modelErr.message);
                  }
              }
          }

          if (!treeData) {
              throw lastError || new Error("AI生成に失敗しました。サーバーの GEMINI_API_KEY 設定、または画面下の API キー設定をご確認ください。");
          }

          console.log(`[AI Skill Tree] Successfully generated tree using: ${successfulModel}`);
          
          if (!this.state.skillTreeCaches[pId]) this.state.skillTreeCaches[pId] = {};
          this.state.skillTreeCaches[pId][mode] = { 
              data: { nodes: treeData.nodes, edges: treeData.edges }, 
              report: treeData.report,
              modelUsed: successfulModel
          };
          this.state.skillTreeGenerating = false;
          
          this.render();
          
      } catch(e) { 
          console.error("Skill Tree Generation Error:", e);
          this.state.skillTreeGenerating = false; 
          this.render(); 
          this.showAlert("生成失敗，原因：\n" + e.message + "\n\n(目前 Google 伺服器流量較大，已為您自動嘗試備援模型。請稍候 5~10 秒後再次點擊即可！)"); 
      }
  },

  drawSkillTree(nodesData, edgesData) {
      const container = document.getElementById('skill-network-container');
      if (!container || typeof vis === 'undefined') return;
      
      const p = this.getProfile();
      
      const acquiredNames = [
          ...p.history.map(i => i.title),
          ...p.skills.map(i => i.title),
          ...(p.achievements || []).map(i => i.title)
      ].join(' ').toLowerCase(); 

      const nodes = new vis.DataSet(nodesData.map(n => {
          let color, shape = 'box', fontColor = '#ffffff';
          
          let currentGroup = n.group;
          if (currentGroup === 'pending' && acquiredNames.includes(n.label.toLowerCase())) {
              currentGroup = 'acquired';
          }

          if(currentGroup === 'acquired') { color = { background: '#10b981', border: '#059669' }; }
          else if(currentGroup === 'pending') { color = { background: '#f59e0b', border: '#d97706' }; }
          else if(currentGroup === 'target') { shape = 'star'; color = { background: '#6366f1', border: '#4f46e5' }; fontColor = '#312e81'; }
          
          return {
            ...n, color: color, shape: shape,
            font: { color: fontColor, size: 14, bold: true, face: 'Inter, Noto Sans TC, Noto Sans JP' },
            shadow: { enabled: true, color: 'rgba(0,0,0,0.12)', size: 8, x: 2, y: 4 },
            margin: 10,
            borderWidth: 2
          };
      }));

      const edges = new vis.DataSet(edgesData.map(e => ({
          ...e, 
          width: 2.5, 
          color: { color: '#cbd5e1', highlight: '#6366f1' }, 
          arrows: 'to', 
          smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 }
      })));

      const data = { nodes: nodes, edges: edges };
      
      const options = {
          physics: {
              enabled: true,
              solver: 'barnesHut',
              barnesHut: { 
                  gravitationalConstant: -2800, 
                  centralGravity: 0.1,         
                  springLength: 130,           
                  springConstant: 0.04,        
                  damping: 0.09                
              },
              stabilization: false 
          },
          layout: { randomSeed: 42 }, 
          interaction: { hover: true, tooltipDelay: 200 }
      };

      if (this.networkInstance) {
          this.networkInstance.destroy();
      }
      this.networkInstance = new vis.Network(container, data, options);

      this.networkInstance.on("selectNode", (params) => {
          const nodeId = params.nodes[0];
          const node = nodes.get(nodeId);
          if (!node) return;
          const lang = App.data.settings.lang || 'zh';
          const isAcquired = node.group === 'acquired' || node.color?.background === '#10b981';
          const isTarget = node.group === 'target';

          if (isAcquired) {
              App.showToast(
                  lang === 'zh' 
                    ? `🌟 【${node.label}】：這是您已深植熟練的人生專業能力！` 
                    : `🌟 【${node.label}】：習得済みのスキルです！さらなる高みを目指しましょう。`,
                  'success',
                  3000
              );
              return;
          }

          const confirmMsg = lang === 'zh'
              ? `💡 【AI 技能指引】：${node.label}\n\n📌 實踐建議：${node.title || '建議納入年度目標深造。'}\n\n是否立即將此項目加入您的「生涯目標・落地清單」？`
              : `💡 【AI 推奨スキル】：${node.label}\n\n📌 詳細・指針：${node.title || 'プランへの設定を推奨します。'}\n\nこの項目を「目標・プラン」リストに追加しますか？`;

          App.showConfirm(confirmMsg, () => {
              const p = App.getProfile();
              if(!p.plans) p.plans = [];
              p.plans.push({
                  id: 'item_' + Date.now(),
                  year: new Date().getFullYear(),
                  month: new Date().getMonth() + 1,
                  title: `[AI 技能目標] ${node.label}`,
                  desc: node.title || '',
                  stage: '全期間共通',
                  status: 'active',
                  author: App.state.loginProfileId,
                  visibility: 'visible',
                  isMilestone: isTarget
              });
              App.saveData();
              App.showToast(
                  lang === 'zh'
                    ? `🎯 已將【${node.label}】納入生涯目標！達成後將點亮技能樹。`
                    : `🎯【${node.label}】を目標に追加しました！達成時に自動的に点灯します。`,
                  'success',
                  3500
              );
              App.render();
          });
      });
  },

  /* === 核心渲染邏輯 === */
  render() {
    const root = document.getElementById('app-root');
    let html = (this.state.view === 'login') ? this.templateLogin() : (this.state.view === 'preview' ? this.templatePrintPreview() : (this.state.view === 'storybook' ? this.templateStorybook() : this.templateApp()));
    if (this.state.modalContext && this.state.view === 'app') html += this.templateModal();
    if (this.state.handoverProfileId) html += this.templateHandoverModal();
    if (this.state.showInheritModal) html += this.templateInheritModal();
    if (this.state.dialog) html += this.templateDialog();
    if (this.state.viewImageSrc) html += this.templateImageViewer(); 
    root.innerHTML = html;
    this.updateHeaderSyncUI();

    if (this.state.view === 'app') {
        if (this.state.activeTab === 'overview') {
            setTimeout(() => App.drawRadarChart(), 100);
        }
        
        if (this.state.activeTab === 'skilltree') {
            const pId = this.state.activeProfileId;
            const mode = this.state.skillTreeMode;
            const cache = this.state.skillTreeCaches[pId]?.[mode];
            
            if (cache && cache.data && !this.state.skillTreeGenerating) {
                setTimeout(() => App.drawSkillTree(cache.data.nodes, cache.data.edges), 100);
            } else if (this.networkInstance) {
                this.networkInstance.destroy();
                this.networkInstance = null;
            }
        }
    }
  },

  updateHeaderSyncUI() {
    const ind = document.getElementById('sync-indicator');
    if(!ind) return;
    if(window.CloudSync?.isLoggedIn) { ind.innerHTML = `<div class="sync-dot ${this.state.isSyncing?'syncing':'online'}"></div> <span>${this.state.isSyncing?this.t('syncing'):this.t('syncOnline')}</span>`; } 
    else { ind.innerHTML = `<span style="color:#94a3b8;">${this.t('syncOffline')}</span>`; }

    } else if (d.type === 'confirm') {
        btns = `<div class="grid-2"><button class="btn btn-secondary btn-full" onclick="App.state.dialog.onCancel()">キャンセル</button><button class="btn btn-primary btn-full" onclick="App.state.dialog.onConfirm()">確定</button></div>`;

        btns = `<div class="grid-2"><button class="btn btn-secondary btn-full" onclick="App.state.dialog=null; App.render()">キャンセル</button><button class="btn btn-success btn-full" onclick="App.confirmCompletePlan('${d.planId}', document.getElementById('complete-cat-select').value)">実績に追加</button></div>`;

        btns = `<div class="grid-2" style="margin-top:15px;">

    }

    const targetId = this.state.loginProfileId;

            <div style="font-weight:800; font-size:14.5px; color:#92400e; margin-bottom:4px;">${this.t('generationalBannerTitle')}</div>
            <div style="font-size:12.5px; color:#78350f; line-height:1.6;">
              ${(this.data.settings.lang==='zh' ? `這份人生履歷由父母在您成長初期悉心記錄（累積 <b>${p.history.length}</b> 筆求學歷程、<b>${p.achievements.length}</b> 筆成長榮耀與父母一生的期待）。今天您已正式接棒主導人生，請在愛的基石上，自主開拓屬於您的輝煌篇章！` : `この人生履歴書は、ご両親があなたの誕生から大切に紡いできた無二の成長資産です（学歴 <b>${p.history.length}</b> 件、実績 <b>${p.achievements.length}</b> 件、親御様の願いを収録）。今日からはあなたが人生の主人公です。自立した未来を力強く描いてください！`)}
            </div>
            ${p.blessingLetter ? `
              <div style="margin-top:10px; padding:10px 14px; background:rgba(255,255,255,0.85); border-radius:6px; border-left:4px solid #d97706; font-style:italic; font-size:13px; color:#78350f; line-height:1.5;">
                “${p.blessingLetter}” <div style="font-size:11px; font-weight:700; color:#b45309; text-align:right; margin-top:4px;">— 父母親筆成人寄語</div>
              </div>
            ` : ''}
          </div>
        </div>
      </div>` : ''}

      <!-- HANDOVER ACTION BANNER (IF PARENT VIEWING CHILD PROFILE) -->
      ${(p.id !== this.data.settings.mainProfileId && (p.role === 'child' || !p.isClaimed)) ? `
      <div class="card" style="margin-bottom:16px; padding:14px 18px; background:linear-gradient(135deg, #f0fdf4, #dcfce7); border:1.5px solid #86efac; border-radius:var(--radius-sm); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="font-size:26px;">🎁</span>
          <div>
            <div style="font-weight:800; font-size:14px; color:#15803d;">${(this.data.settings.lang==='zh'?'世代傳承・將人生履歷交接給孩子獨立管理':'世代継承・お子様へ人生履歴書を引き渡す')}</div>
            <div style="font-size:12px; color:#166534;">${(this.data.settings.lang==='zh'?'當孩子長大成人，一鍵生成傳承碼與寄語信，讓孩子接棒這份成長資產。':'誕生からの全記録を専用コードでお子様本人へ引き渡し、独立した人生管理を始めさせます。')}</div>
          </div>
        </div>
        <button class="btn btn-success btn-sm" style="background:linear-gradient(135deg, #16a34a, #15803d); font-weight:700; padding:8px 14px;" onclick="App.openHandoverModal('${p.id}')">
          🎁 ${(this.data.settings.lang==='zh'?'進行世代交接儀式':'継承の儀を行う')}
        </button>
      </div>` : ''}

      <!-- MODERN SEGMENTED TABS (完全修復切邊) -->
      <div class="tabs-wrapper">
        ${tabsList.map(([k, label]) => `<div class="tab ${this.state.activeTab === k ? 'active' : ''}" onclick="App.changeTab('${k}')">${label}</div>`).join('')}
      </div>

      <!-- MAIN TAB CONTENT -->
      <div id="tab-content">${this.renderTabContent(p)}</div>
    </div>

    <!-- FLOATING ACTION BUTTON (QUICK ADD) -->
    <button class="fab-btn" title="${this.t('quickAdd')}" onclick="App.openQuickAddModal()">＋</button>
    `;
  },

  openQuickAddModal() {
    const tab = this.state.activeTab;
    if (tab === 'history' || tab === 'skills' || tab === 'achievements' || tab === 'diary' || tab === 'plans') {
        this.openModal(tab);
    } else {
        this.openModal('plans');
    }
  },

  renderTabContent(p) {
    const tab = this.state.activeTab; const b = p.basic;
    const myId = this.state.loginProfileId;
    const isReadOnly = p.id !== myId && p.isClaimed === true;
    
    let topNotice = isReadOnly ? `<div style="background:#e0f2fe; color:#0369a1; padding:12px 16px; border-radius:var(--radius-sm); margin-bottom:18px; font-size:13px; font-weight:600; border:1px solid #bae6fd;">ℹ️ このプロフィールは共有受信中のため、閲覧および「期待」の追加のみ可能です。</div>` : '';

    if(tab === 'overview') {
      const totalHistory = p.history.length; const totalSkills = p.skills.length; const totalPlans = p.plans.length;
      const reachedPlans = p.plans.filter(pl => pl.status === 'completed').length;
      const successRate = totalPlans ? Math.round((reachedPlans / totalPlans) * 100) : 0;

      let html = topNotice + `
        <div class="grid-2" style="margin-bottom:20px;">
            <div>
                <div class="stats-grid" style="margin-bottom:0; height:100%; grid-template-columns: 1fr 1fr;">
                  <div class="stat-box"><div class="stat-val">${totalHistory}</div><div class="stat-label">${(this.data.settings.lang==='zh')?'學歷・經歷':'学歴・職歴'}</div></div>
                  <div class="stat-box"><div class="stat-val">${totalSkills}</div><div class="stat-label">${(this.data.settings.lang==='zh')?'證照・資格':'免許・資格'}</div></div>
                  <div class="stat-box"><div class="stat-val" style="color:var(--success);">${successRate}%</div><div class="stat-label">${(this.data.settings.lang==='zh')?'目標達成率':'目標達成率'}</div></div>
                  <div class="stat-box"><div class="stat-val">${totalPlans}</div><div class="stat-label">${(this.data.settings.lang==='zh')?'設定目標數':'設定プラン'}</div></div>
                </div>
            </div>
            <div class="card" style="margin-bottom:0; padding:16px;">
              <div style="font-size:13px; text-align:center; font-weight:700; color:var(--primary-dark); margin-bottom:6px;">${this.t('abilityParams')}</div>
              <div class="chart-container"><canvas id="skillRadarChart"></canvas></div>
            </div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>⏱️ ${(this.data.settings.lang==='zh')?'雙軌時間軸對比':'タイムライン対比'}</span>
          </div>

          <!-- Timeline Filter Chips -->
          <div class="timeline-filter-bar">
            ${[
              ['all', this.t('all')],
              ['history', this.t('filterHistory')],
              ['skills', this.t('filterSkills')],
              ['achievements', this.t('filterAchieve')],
              ['plans', this.t('filterPlans')],
              ['diary', this.t('filterDiary')]
            ].map(([fKey, fLabel]) => `<div class="filter-chip ${this.state.timelineFilter === fKey ? 'active' : ''}" onclick="App.setTimelineFilter('${fKey}')">${fLabel}</div>`).join('')}
          </div>

          <div class="timeline-dual">`;
      
      let items = [];
      if(b.birthday) items.push({ filterType: 'history', year: new Date(b.birthday).getFullYear(), month: new Date(b.birthday).getMonth()+1, title: '誕生', catLabel: 'Birth', isPlan: false, color: 'var(--birth-color)' });
      p.history.forEach(i => items.push({...i, filterType: 'history', catLabel: (this.data.settings.lang==='zh'?'經歷':'経歴'), color: 'var(--primary)'}));
      p.skills.forEach(i => items.push({...i, filterType: 'skills', catLabel: (this.data.settings.lang==='zh'?'資格':'資格'), color: 'var(--skill-color)'}));
      p.achievements.forEach(i => items.push({...i, filterType: 'achievements', catLabel: (this.data.settings.lang==='zh'?'實績':'実績'), color: 'var(--achieve-color)'}));
      
      (p.diary||[]).forEach(i => {
          const isOwner = i.author === myId;
          if (isOwner || i.visibility === 'visible') {
              items.push({...i, filterType: 'diary', catLabel: (this.data.settings.lang==='zh'?'筆記':'メモ'), color: 'var(--diary-color)', displayDate: i.date});
          } else {
              items.push({ filterType: 'diary', year: i.year, month: i.month, title: '🔒 未公開メモ', catLabel: (this.data.settings.lang==='zh'?'筆記':'メモ'), color: '#cbd5e1', displayDate: i.date });
          }
      });
      
      p.plans.forEach(i => {
          const isOwner = i.author === myId;
          let label = 'プラン';
          let color = 'var(--plan-my)';

          if (p.id === myId) {
              label = i.author === myId ? (this.data.settings.lang==='zh'?'自身目標':'自分の目標') : (this.data.settings.lang==='zh'?'親友期待':'親・家族の期待');
              color = i.author === myId ? 'var(--plan-my)' : 'var(--plan-parent)';
          } else {
              label = i.author === myId ? (this.data.settings.lang==='zh'?'我的期待':'私の期待') : `${p.name}の目標`;
              color = i.author === myId ? 'var(--plan-parent)' : 'var(--plan-my)';
          }

          if(isOwner || i.visibility === 'visible') items.push({...i, filterType: 'plans', catLabel: label, isPlan:true, color: color, status: i.status});
          else items.push({ filterType: 'plans', year: i.year, month: i.month, title: '🔒 未公開目標', catLabel: label, isPlan: true, color: '#cbd5e1' }); 
      });

      if (this.state.timelineFilter !== 'all') {
          items = items.filter(i => i.filterType === this.state.timelineFilter);
      }

      items.sort((a,b) => (a.year||0)-(b.year||0) || (a.month||0)-(b.month||0));
      
      if (items.length === 0) {
          html += `<div style="text-align:center; color:var(--text-muted); padding:30px; font-size:14px;">${(this.data.settings.lang==='zh')?'無符合條件的紀錄':'該当する記録がありません'}</div>`;
      }

      items.forEach(i => {
        const titleDecor = i.status === 'completed' ? ` <span class="badge-success">${(this.data.settings.lang==='zh'?'已達成':'達成済')}</span>` : '';
        const milestoneBadge = i.isMilestone ? ` <span class="milestone-badge">⭐ ${(this.data.settings.lang==='zh'?'關鍵里程碑':'重要マイルストーン')}</span>` : '';
        const dateStr = i.displayDate ? i.displayDate.replace(/-/g, '/') : `${i.year||'?'}年${i.month?i.month+'月':''}`;
        const titleFontSize = i.catLabel === 'メモ' || i.catLabel === '筆記' ? '14px' : '16px';
        const titleFontWeight = i.catLabel === 'メモ' || i.catLabel === '筆記' ? '500' : '700';

        html += `<div class="tl-container ${i.isPlan?'tl-right':'tl-left'}"><div class="tl-dot" style="border-color: ${i.color};"></div><div class="tl-content ${i.isMilestone?'is-milestone':''}" style="border-${i.isPlan?'left':'right'}:4px solid ${i.color};"><div style="font-size:11px; font-weight:700; color:var(--text-sub); display:flex; align-items:center; gap:6px; flex-wrap:wrap;"><span class="tag" style="background:${i.color}">${i.catLabel}</span> ${dateStr} ${milestoneBadge}</div><div style="font-weight:${titleFontWeight}; font-size:${titleFontSize}; margin-top:6px; white-space:pre-wrap;">${i.title} ${i.eduStatus?`[${i.eduStatus}]`:''} ${titleDecor}</div>${i.desc?`<div style="font-size:12.5px; color:var(--text-sub); margin-top:6px; line-height:1.4;">${i.desc}</div>`:''}${i.photo?`<img src="${i.photo}" style="width:100%; max-width:200px; margin-top:10px; border-radius:8px; cursor:zoom-in; border:1px solid #e2e8f0;" onclick="App.viewImage('${i.photo}')">`:''}</div></div>`;
      });
      return html + `</div></div>`;
    }

    if(tab === 'basic') {
      const todayStr = this.getLocalTodayString();
      return topNotice + `<div class="card"><div class="card-title">${this.t('basic')} (JIS R3)</div><div class="grid-2"><div class="profile-photo-area">${b.photo ? `<img src="${b.photo}" class="profile-photo-img" style="cursor:zoom-in;" onclick="App.viewImage('${b.photo}')">${isReadOnly ? '' : `<button class="btn btn-secondary btn-sm" onclick="App.updateBasic('photo', null)">削除</button>`}` : `<div style="width:110px; height:140px; border:2px dashed #cbd5e1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:28px;">📷</div>${isReadOnly ? '' : `<button class="btn btn-primary btn-sm" onclick="App.uploadPhoto('basic')">写真貼付</button>`}`}</div><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">氏名 / 姓名</label><input type="text" value="${p.name}" onchange="App.updateName(this.value)" ${isReadOnly ? 'disabled' : ''}><label style="font-size:12px; font-weight:700; color:var(--text-sub);">ふりがな / 拼音</label><input type="text" value="${b.furigana||''}" onchange="App.updateBasic('furigana', this.value)" ${isReadOnly ? 'disabled' : ''}><div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">性別 (任意)</label><select onchange="App.updateBasic('gender', this.value)" ${isReadOnly ? 'disabled' : ''}><option value="" ${b.gender===''?'selected':''}>未記載</option><option value="male" ${b.gender==='male'?'selected':''}>男</option><option value="female" ${b.gender==='female'?'selected':''}>女</option></select></div><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">生年月日</label><input type="date" value="${b.birthday||''}" max="${todayStr}" onchange="App.updateBasic('birthday', this.value)" ${isReadOnly ? 'disabled' : ''}></div></div></div></div>
      <div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">現住所 郵便番号 / 郵遞區號</label><input type="text" value="${b.postalCode||''}" onchange="App.updateBasic('postalCode', this.value)" ${isReadOnly ? 'disabled' : ''}></div><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">現住所 / 地址</label><input type="text" value="${b.address||''}" onchange="App.updateBasic('address', this.value)" ${isReadOnly ? 'disabled' : ''}></div></div>
      <div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">電話番号</label><input type="text" value="${b.phone||''}" onchange="App.updateBasic('phone', this.value)" ${isReadOnly ? 'disabled' : ''}></div><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">Email</label><input type="text" value="${b.email||''}" onchange="App.updateBasic('email', this.value)" ${isReadOnly ? 'disabled' : ''}></div></div>
      
      <div style="margin-top:20px; border-top:1px dashed var(--border); padding-top:20px;"></div>
      <div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">連絡先 郵便番号 (現住所と異なる場合)</label><input type="text" value="${b.contactPostalCode||''}" onchange="App.updateBasic('contactPostalCode', this.value)" ${isReadOnly ? 'disabled' : ''}></div><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">連絡先 住所</label><input type="text" value="${b.contactAddress||''}" onchange="App.updateBasic('contactAddress', this.value)" ${isReadOnly ? 'disabled' : ''}></div></div>
      <div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">連絡先 電話番号</label><input type="text" value="${b.contactPhone||''}" onchange="App.updateBasic('contactPhone', this.value)" ${isReadOnly ? 'disabled' : ''}></div><div></div></div>
      <div style="margin-top:16px; border-top:1px dashed var(--border); padding-top:16px;">
        <label style="font-size:12px; font-weight:700; color:var(--text-sub);">${this.t('mottoLabel')}</label>
        <input type="text" value="${b.motto||''}" placeholder="${this.t('mottoPlaceholder')}" onchange="App.updateBasic('motto', this.value)" ${isReadOnly ? 'disabled' : ''}>
      </div>
      </div>`;
    }

    if(tab === 'history') return topNotice + this.buildListUI('history', this.t('history'), isReadOnly);
    if(tab === 'skills') return topNotice + this.buildListUI('skills', this.t('skills'), isReadOnly);
    if(tab === 'achievements') return topNotice + this.buildListUI('achievements', this.t('achievements'), isReadOnly);
    if(tab === 'diary') return topNotice + this.buildDiaryUI('diary', this.t('diary'), isReadOnly);
    
    if(tab === 'plans') {
        const requests = (p.plans||[]).filter(i => i.author === myId && i.visibility === 'requested');
        let reqHtml = ''; if(requests.length > 0) reqHtml = `<div class="card" style="background:#fff7ed; border-color:#fdba74;"><h3>承認待ちリクエスト</h3>${requests.map(r => `<div class="list-item"><div>${r.year}年: ${r.title}</div><button class="btn btn-success btn-sm" onclick="App.grantAccess('plans','${r.id}')">承認</button></div>`).join('')}</div>`;
        
        const renderP = (isTargetMyAuth) => {
            const filtered = (p.plans||[]).filter(i => (i.author === myId) === isTargetMyAuth);
            if(filtered.length === 0) return '<p style="text-align:center; font-size:13px; color:#999; padding:20px;">データなし</p>';
            return filtered.map(i => {
                const isOwner = i.author === myId; 
                if(isOwner || i.visibility === 'visible') {
                    const isCompleted = i.status === 'completed';
                    const canEdit = isOwner; 
                    const canComplete = !isCompleted && (isOwner || p.id === myId); 
                    
                    const compBtn = canComplete ? `<button class="btn btn-success btn-sm" onclick="event.stopPropagation(); App.triggerCompletePlan('${i.id}')">${(this.data.settings.lang==='zh'?'達成':'達成')}</button>` : '';
                    const visibilityBtn = isOwner ? `<button class="btn ${i.visibility === 'visible' ? 'btn-secondary' : 'btn-primary'} btn-sm" onclick="event.stopPropagation(); App.toggleVisibility('plans','${i.id}')">${i.visibility === 'visible' ? '🔓 公開中' : '🔒 非公開'}</button>` : '';
                    const titleUI = isCompleted ? `<span class="badge-success">${(this.data.settings.lang==='zh'?'已達成':'達成済')}</span> <strike style="color:#94a3b8;">${i.title}</strike>` : i.title;

                    const milestoneBadge = i.isMilestone ? ` <span class="milestone-badge">⭐ ${(this.data.settings.lang==='zh'?'關鍵里程碑':'重要マイルストーン')}</span>` : '';
                    return `<div class="list-item ${i.isMilestone ? 'is-milestone' : ''}"><div class="item-content" ${canEdit?`onclick="App.openModal('plans','${i.id}')"`:''}><div class="item-meta" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;"><span>${i.year}年</span> <span class="tag" style="background:#64748b;">${i.stage}</span> ${milestoneBadge}</div><div class="item-title">${titleUI}</div><div class="item-desc">${i.desc||''}</div></div><div style="display:flex; flex-direction:column; gap:6px; min-width:80px;">${visibilityBtn}${compBtn}${canEdit?`<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); App.deleteItem('plans','${i.id}')">削除</button>`:''}</div></div>`;
                }
                return `<div class="list-item" style="align-items:center;"><div><span class="tag" style="background:#64748b;">${i.stage}</span> 🔒 内容非公開</div> <button class="btn btn-primary btn-sm" onclick="App.requestAccess('plans','${i.id}')">${i.visibility==='requested'?'要請中':'表示要請'}</button></div>`;
            }).join('');
        };

        let myTitle = ''; let otherTitle = '';
        let showAddMy = false;
        const isClaimedAdult = (p.role === 'claimed_adult' || p.inheritedAt || p.claimedAsSelf);
        if (p.id === myId) {
            myTitle = isClaimedAdult ? this.t('childGoalsTitle') : this.t('myPlansTitle');
            otherTitle = isClaimedAdult ? this.t('parentHopesTitle') : this.t('parentExpectTitle'); 
            showAddMy = true;
        } else {
            myTitle = this.t('myExpectToChildTitle'); 
            otherTitle = this.t('childSelfGoalTitle'); 
            showAddMy = !isReadOnly;
        }
        
        return topNotice + reqHtml + `<div class="grid-2">
            <div class="card" style="border-top:4px solid var(--plan-my);">
                <div class="card-title"><span>${myTitle}</span> ${showAddMy ? `<button class="btn btn-primary btn-sm" onclick="App.openModal('plans')">+</button>` : ''}</div>
                ${renderP(true)}
            </div>
            <div class="card" style="border-top:4px solid var(--plan-parent);">
                <div class="card-title"><span>${otherTitle}</span></div>
                ${renderP(false)}
            </div>
        </div>`;
    }

    if (tab === 'skilltree') {
        const isA = this.state.skillTreeMode === 'A';
        const pId = this.state.activeProfileId;
        const cache = this.state.skillTreeCaches[pId]?.[this.state.skillTreeMode];
        const currentReport = cache ? cache.report : '';

        return `<div class="card" style="border-top: 4px solid #6366f1;">
            <div class="card-title">
                <span>${this.t('skilltree')}</span>
                <span class="badge-success">Powered by Gemini AI</span>
            </div>
            <p style="font-size:13.5px; color:var(--text-sub); line-height:1.6; margin-top:-6px;">${(this.data.settings.lang==='zh'?'AI 將整合分析您所有的資料（年齡、性別、經歷、目標），繪製出專屬的技能成長拓撲路徑。<br>💡 <b>提示：</b>點擊「琥珀色」節點，可直接將該技能加入目標清單！':'AIが全データ（年齢、性別、経歴、目標）を統合分析し、専用のスキルパスを描画します。<br>💡 <b>ヒント：</b>「琥珀色」のノードをクリックすると、目標リストに直接追加できます！')}</p>
            
            <div style="background:#f8fafc; padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:18px;">
                <div style="display:flex; gap:10px; margin-bottom:12px;">
                    <button class="btn ${!isA?'btn-primary':'btn-secondary'}" style="flex:1;" onclick="App.state.skillTreeMode='B'; App.render()">${this.t('exploreMode')}</button>
                    <button class="btn ${isA?'btn-primary':'btn-secondary'}" style="flex:1;" onclick="App.state.skillTreeMode='A'; App.render()">${this.t('targetMode')}</button>
                </div>
