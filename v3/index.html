        const cache = this.state.skillTreeCaches[pId]?.[this.state.skillTreeMode];
        const currentReport = cache ? cache.report : '';

        return `<div class="card" style="border-top: 4px solid #6366f1;">
            <div class="card-title">
                <span>${this.t('skilltree')}</span>
                <span class="badge-success">Powered by Gemini AI</span>
            </div>
            <p style="font-size:13.5px; color:var(--text-sub); line-height:1.6; margin-top:-6px;">${(this.data.settings.lang==='zh'?'AI 將整合分析您所有的資料（年齡、性別、經歷、目標），繪製出專屬的技能成長拓撲路徑。<br>💡 <b>提示：</b>點擊「琥珀色」節點，可直接將該技能加入目標清單！':'AIが全データ（年齢、性別、経歴、目標）を統合分析し、専用のスキルパスを描画します。<br>💡 <b>ヒント：</b>「琥珀色」のノードをクリックすると、目標リストに直接追加できます！')}</p>
            
            <div style="background:#f8fafc; padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:18px;">
                <div style="display:flex; gap:10px; margin-bottom:12px;">
                    <button class="btn ${!isA?'btn-primary':'btn-secondary'}" style="flex:1;" onclick="App.state.skillTreeMode='B'; App.render()">${this.t('exploreMode')}</button>
                    <button class="btn ${isA?'btn-primary':'btn-secondary'}" style="flex:1;" onclick="App.state.skillTreeMode='A'; App.render()">${this.t('targetMode')}</button>
                </div>
                ${isA ? `<input type="text" placeholder="${(this.data.settings.lang==='zh'?'輸入目標職業 (例: IT架構師、專業模特兒)':'目標の職業を入力 (例: ITマネージャー、プロモデル)')}" value="${this.state.skillTreeTarget}" onchange="App.state.skillTreeTarget=this.value; if(App.state.skillTreeCaches['${pId}']) App.state.skillTreeCaches['${pId}']['A']=null; App.render();" style="margin-bottom:0;">` : `<div style="font-size:12.5px; color:#64748b; text-align:center; padding:6px;">💡 ${(this.data.settings.lang==='zh'?'提示：AI 將根據目前的背景與期待，探索推薦未來 2~3 條高潛力職涯途徑。':'ヒント：AIが現在のプロフィールや環境に基づいて、将来有望なキャリアパスを提案します。')}</div>`}
            </div>

            <button class="btn btn-primary btn-full" style="padding:14px; font-size:16px; margin-bottom:20px;" onclick="App.generateSkillTree()" ${this.state.skillTreeGenerating?'disabled':''}>
                ${this.state.skillTreeGenerating?this.t('generating'):this.t('generateTree')}
            </button>

            <!-- Skill Tree Canvas Container with Control Bar -->
            <div id="skill-network-container" style="${this.state.skillTreeGenerating?'opacity:0.3;':''}">
                <div class="canvas-control-bar">
                  <button class="canvas-ctrl-btn" title="放大" onclick="App.zoomSkillTree(1.2)">➕</button>
                  <button class="canvas-ctrl-btn" title="縮小" onclick="App.zoomSkillTree(0.8)">➖</button>
                  <button class="canvas-ctrl-btn" title="全景置中" onclick="App.resetSkillTree()">🎯</button>
                  <button class="canvas-ctrl-btn" title="物理模擬切換" onclick="App.togglePhysics()">⏸️</button>
                </div>
                ${cache ? '' : `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:14px; font-weight:500;">${(this.data.settings.lang==='zh'?'請點擊上方按鈕啟動 AI 生成':'上のボタンをクリックしてAIを起動してください')}</div>`}
            </div>

            ${currentReport ? `
            <div style="background:#fffbeb; font-size:13.5px; border:1px solid #fde68a; padding:18px; border-radius:var(--radius-sm); margin-top:16px; line-height:1.6; white-space:pre-wrap; color:#78350f;">
                ${currentReport}
            </div>` : ''}

            <div style="margin-top:24px; font-size:12px; display:flex; flex-direction:column; gap:12px; border-top:1px dashed var(--border); padding-top:16px;">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-weight:700;">🔑 API Key (本機保存):</span>
                  <input type="password" value="${this.getGeminiKey()}" onchange="App.setGeminiKey(this.value)" placeholder="AIzaSy..." style="max-width:240px; margin-bottom:0; padding:6px 10px;">
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-weight:700;">🤖 AIモデル:</span>
                  <select onchange="App.setGeminiModel(this.value)" style="max-width:240px; margin-bottom:0; padding:6px 10px;">
                      <option value="gemini-3.6-flash" ${this.getGeminiModel()==='gemini-3.6-flash'?'selected':''}>gemini-3.6-flash (最新・最速・推奨)</option>
                      <option value="gemini-3.7-flash" ${this.getGeminiModel()==='gemini-3.7-flash'?'selected':''}>gemini-3.7-flash (最新・高精度)</option>
                      <option value="gemini-2.5-flash" ${this.getGeminiModel()==='gemini-2.5-flash'?'selected':''}>gemini-2.5-flash</option>
                      <option value="gemini-1.5-flash" ${this.getGeminiModel()==='gemini-1.5-flash'?'selected':''}>gemini-1.5-flash (安定版)</option>
                      <option value="gemini-1.5-pro" ${this.getGeminiModel()==='gemini-1.5-pro'?'selected':''}>gemini-1.5-pro</option>
                  </select>
                </div>
            </div>
        </div>`;
    }

    if(tab === 'settings') {
      const hCount = p.history.length;
      const maxRowsNotice = (hCount > 20) ? `<div style="color:var(--danger); font-size:11px; margin-top:4px;">⚠️ 学歴・職歴が多いため（${hCount}件）、JIS印刷時に22行を超えた分は省略されます。チェックを外して調整してください。</div>` : '';

      return `
        <div class="card" style="border-top:4px solid var(--primary);">
          <div class="card-title"><span>🤝 ${(this.data.settings.lang==='zh'?'家族共享・即時共同編輯':'家族共有・リアルタイム共同編集')}</span></div>
          <p style="font-size:12.5px; color:var(--text-sub);">${(this.data.settings.lang==='zh'?'發行專屬共享碼，可與其他 Google 帳號即時雙向同步。':'共有コードを発行し、他の家族のGoogleアカウントへデータを転送・共有できます。')}</p>
          <div class="grid-2" style="margin-bottom:16px;">
            <select id="share-profile-select" style="margin-bottom:0;"><option value="${p.id}">${p.name} のデータを共有</option></select>
            <button class="btn btn-primary" onclick="App.generateShareCode()">${(this.data.settings.lang==='zh'?'發行共享碼 (Push)':'共有コードを発行 (Push)')}</button>
          </div>
          <div style="border-top:1px dashed #cbd5e1; padding-top:16px;" class="grid-2">
            <input type="text" id="import-share-code" placeholder="共有コードを入力 (例: LR-ABC123)" style="margin-bottom:0;">
            <button class="btn btn-success" onclick="App.importSharedProfile(document.getElementById('import-share-code').value)">${(this.data.settings.lang==='zh'?'接收共享資料 (Pull)':'データを受け取る (Pull)')}</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><span>🔐 ${p.name} ${(this.data.settings.lang==='zh'?'專屬密碼鎖設定':'専用パスワード設定')}</span></div>
          <p style="font-size:12.5px; color:var(--text-sub);">${(this.data.settings.lang==='zh'?'此身份的專屬密碼，留空則無需驗證即可切換。':'このプロフィール専用のパスワードです。空欄にすると認証なしでログインできます。')}</p>
          <div class="grid-2"><input type="password" id="profile-pwd" placeholder="新パスワードを入力" value="${p.password||''}" style="margin-bottom:0;">
          <button class="btn btn-primary" onclick="const v=document.getElementById('profile-pwd').value; App.getProfile().password=v; App.saveData(); App.showAlert('パスワードを更新しました。');">パスワードを更新</button></div>
        </div>
        
        <div class="card" style="background:#f0fdfa; border-color:#ccfbf1;">
          <div class="card-title"><span style="color:#0f766e;">☁️ Google クラウド同期</span></div>
          ${window.CloudSync?.isLoggedIn && window.CloudSync.user ? 
            `<div style="display:flex; justify-content:space-between; align-items:center; background:white; padding:12px 16px; border-radius:var(--radius-sm); border:1px solid #99f6e4; margin-bottom:12px;">
               <div style="display:flex; align-items:center; gap:10px;">
                 <img src="${window.CloudSync.user.photoURL}" style="width:32px; height:32px; border-radius:50%;">
                 <span style="font-size:13.5px; font-weight:700; color:#0f766e;">${window.CloudSync.user.displayName}</span>
               </div>
               <button class="btn btn-secondary btn-sm" onclick="window.CloudSync.logout()">連携解除</button>
             </div>
             <p style="font-size:12px; color:var(--text-sub); margin:0;">データはリアルタイムで安全に自動同期されています。</p>` 
             : 
             `<div id="google-auth-area" style="margin-bottom:10px;"><button class="btn btn-google btn-full" onclick="window.CloudSync.login()"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="width:16px; margin-right:8px;"> アカウントを連携する</button></div>`
          }
        </div>

        <div class="card">
          <div class="card-title"><span>💾 ${(this.data.settings.lang==='zh'?'本地手動備份 (JSON)':'ローカルバックアップ (ゲスト用)')}</span></div>
          <p style="font-size:12.5px; color:var(--text-sub);">${(this.data.settings.lang==='zh'?'手動匯出或匯入 JSON 格式備份檔。':'手動でローカルに保存・復元できます。')}</p>
          <div class="grid-2">
            <button class="btn btn-secondary" onclick="App.exportLocalData()">エクスポート (.json)</button>
            <button class="btn btn-secondary" onclick="document.getElementById('inp-import-json').click()">インポート (.json)</button>
            <input type="file" id="inp-import-json" class="hidden" accept=".json" onchange="App.importLocalData(event)">
          </div>
        </div>

        <div class="card" style="background:#fffbeb; border-color:#fde68a;">
          <div class="card-title"><span style="color:#b45309;">📄 JIS 履歴書出力 (R3規格準拠)</span></div>
          <p style="font-size:12.5px; color:#78350f;">厚労省準拠の最新R3規格に準拠した完璧なA4見開き(2ページ)形式で出力します。</p>
          <div class="grid-2" style="margin-bottom:16px;">
              <div><label style="font-size:12px; font-weight:700;">年号表記</label><select onchange="App.updateSetting('printEra', this.value)" style="margin-bottom:0;"><option value="western" ${this.data.settings.printEra==='western'?'selected':''}>西暦 (2026年)</option><option value="japanese" ${this.data.settings.printEra==='japanese'?'selected':''}>和暦 (令和8年)</option></select></div>
              <div></div>
          </div>
          <div class="grid-2">
              <div><label style="font-size:12px; font-weight:700;">学歴・職歴の出力選択</label><div class="export-check-list" id="export-history-list">${p.history.map(i=>`<div class="export-check-item"><input type="checkbox" id="chk_h_${i.id}" value="${i.id}" checked><label for="chk_h_${i.id}">${i.year}年: ${i.title}</label></div>`).join('') || '<div style="font-size:12px; color:#999;">データなし</div>'}</div>${maxRowsNotice}</div>
              <div><label style="font-size:12px; font-weight:700;">免許・資格の出力選択</label><div class="export-check-list" id="export-skills-list">${p.skills.map(i=>`<div class="export-check-item"><input type="checkbox" id="chk_s_${i.id}" value="${i.id}" checked><label for="chk_s_${i.id}">${i.year}年: ${i.title}</label></div>`).join('') || '<div style="font-size:12px; color:#999;">データなし</div>'}</div></div>
          </div>
          <div style="margin-top:16px; border-top:1px dashed #fde68a; padding-top:16px;"></div>
          <label style="font-size:12px; font-weight:700;">本人希望記入欄 (特に給料・職種・勤務時間・勤務地・その他)</label>
          <textarea rows="3" onchange="App.updateBasic('desiredConditions', this.value)" placeholder="特になし" ${isReadOnly ? 'disabled' : ''}>${b.desiredConditions||''}</textarea>
          <button class="btn btn-primary btn-full" style="margin-top:12px;" onclick="App.triggerPrintMode()">${this.t('jisPrintBtn')}</button>
        </div>
        ${p.id !== this.data.settings.mainProfileId ? `<div class="card" style="border-color:var(--danger); background:#fff1f2;"><div class="card-title"><span style="color:var(--danger);">プロフィールの削除</span></div><p style="font-size:12px;">この端末から「${p.name}」のデータを削除します。</p><button class="btn btn-danger btn-full" onclick="App.deleteProfile('${p.id}')">🗑️ このプロフィールを削除</button></div>` : ''}
        <div class="card" style="font-size:11px; color:#94a3b8; text-align:center;"><p style="margin:0;">人生履歴書 V3.0 Pro PWA Edition<br>Producer: M.K(TW)</p></div>`;
    }
  },

  buildListUI(cat, title, isReadOnly) {
    const items = this.getProfile()[cat] || [];
    let html = `<div class="card"><div class="card-title"><span>${title}</span> ${isReadOnly ? '' : `<button class="btn btn-primary btn-sm" onclick="App.openModal('${cat}')">+</button>`}</div>`;
    if(items.length === 0) html += `<p style="font-size:13.5px; color:#94a3b8; text-align:center; padding:20px;">${(this.data.settings.lang==='zh'?'目前尚無資料':'データがありません')}</p>`;
    items.forEach(i => {
      html += `<div class="list-item"><div class="item-content" ${isReadOnly ? '' : `onclick="App.openModal('${cat}', '${i.id}')"`}><div class="item-meta">${i.year||'?'}年 ${i.stage||''} ${i.eduStatus?`[${i.eduStatus}]`:''} ${i.dim?`[${i.dim}]`:''}</div><div class="item-title">${i.title}</div><div class="item-desc">${i.desc||''}</div></div><div class="photo-wrapper" style="position:relative;">${i.photo ? `<img src="${i.photo}" class="photo-thumb" onclick="event.stopPropagation(); App.viewImage('${i.photo}')">${isReadOnly ? '' : `<button class="btn btn-danger btn-sm" style="position:absolute; top:-6px; right:-6px; padding:2px 6px; font-size:10px; border-radius:50%;" onclick="event.stopPropagation(); App.deleteItemPhoto('${cat}','${i.id}')">×</button>`}` : (isReadOnly ? '' : `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); App.uploadPhoto('item','${cat}','${i.id}')">📷</button>`)}</div>${isReadOnly ? '' : `<div style="display:flex; flex-direction:column; gap:6px; min-width:60px;"><button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); App.deleteItem('${cat}','${i.id}')">削除</button></div>`}</div>`;
    });
    if(cat === 'skills') html += `<div style="margin-top:16px;"><label style="font-size:12px; font-weight:700; color:var(--text-sub);">志望の動機、特技、アピールポイントなど / 自我推薦與動機</label><textarea rows="3" onchange="App.updateBasic('motivation', this.value)" placeholder="自己PRや志望動機などを入力" ${isReadOnly ? 'disabled' : ''}>${this.getProfile().basic.motivation||''}</textarea></div>`;
    return html + `</div>`;
  },

  buildDiaryUI(cat, title, isReadOnly) {
    const p = this.getProfile();
    const myId = this.state.loginProfileId;
    const isOwnerView = (p.id === myId); 
    
    const requests = isOwnerView ? (p[cat]||[]).filter(i => i.visibility === 'requested') : [];
    let reqHtml = '';
    if (requests.length > 0) {
        reqHtml = `<div class="card" style="background:#fff7ed; border-color:#fdba74;"><h3>承認待ちリクエスト</h3>${requests.map(r => `<div class="list-item"><div>${r.date}: ${r.title}</div><button class="btn btn-success btn-sm" onclick="App.grantAccess('${cat}', '${r.id}')">公開する</button></div>`).join('')}</div>`;
    }

    let html = `<div class="card" style="border-top:4px solid var(--diary-color);"><div class="card-title"><span>${title}</span> ${isOwnerView ? `<button class="btn btn-primary btn-sm" onclick="App.openModal('${cat}')">+</button>` : ''}</div>`;
    
    const filtered = [...(p[cat] || [])].sort((a,b) => (b.date > a.date ? 1 : -1));
    if (filtered.length === 0) html += `<p style="text-align:center; font-size:13.5px; color:#94a3b8; padding:20px;">${(this.data.settings.lang==='zh'?'目前尚無紀錄':'記録がありません')}</p>`;

    filtered.forEach(i => {
      if (isOwnerView || i.visibility === 'visible') {
          const canEdit = isOwnerView; 
          const visibilityBtn = isOwnerView ? `<button class="btn ${i.visibility === 'visible' ? 'btn-secondary' : 'btn-primary'} btn-sm" onclick="event.stopPropagation(); App.toggleVisibility('${cat}','${i.id}')">${i.visibility === 'visible' ? '🔓 公開中' : '🔒 非公開'}</button>` : '';
          const actionBtns = canEdit ? `<div style="display:flex; flex-direction:column; gap:6px; min-width:80px;">${visibilityBtn}<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); App.deleteItem('${cat}','${i.id}')">削除</button></div>` : '';

          html += `<div class="list-item"><div class="item-content" ${canEdit ? `onclick="App.openModal('${cat}', '${i.id}')"` : ''}><div class="item-meta" style="color:var(--diary-color); font-weight:700;">${i.date}</div><div class="item-title" style="font-weight:500; font-size:15px; white-space:pre-wrap;">${i.title}</div></div><div class="photo-wrapper" style="position:relative; margin-right:10px;">${i.photo ? `<img src="${i.photo}" class="photo-thumb" onclick="event.stopPropagation(); App.viewImage('${i.photo}')">${canEdit ? `<button class="btn btn-danger btn-sm" style="position:absolute; top:-6px; right:-6px; padding:2px 6px; font-size:10px; border-radius:50%;" onclick="event.stopPropagation(); App.deleteItemPhoto('${cat}','${i.id}')">×</button>`:''}` : (canEdit ? `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); App.uploadPhoto('item','${cat}','${i.id}')">📷</button>`:'')}</div>${actionBtns}</div>`;
      } else {
          html += `<div class="list-item" style="align-items:center;"><div><span class="tag" style="background:#64748b;">${i.date}</span> 🔒 内容非公開</div> <button class="btn btn-primary btn-sm" onclick="App.requestAccess('${cat}', '${i.id}')">${i.visibility==='requested'?'要請中':'閲覧をリクエスト'}</button></div>`;
      }
    });
    html += `</div>`;
    return reqHtml + html;
  },

  templateModal() {
    const ctx = this.state.modalContext; const p = this.getProfile(); const isNew = ctx.itemId === null;
    const item = isNew ? {} : p[ctx.category].find(i => i.id === ctx.itemId);
    
    if (ctx.category === 'diary') {
        const todayStr = this.getLocalTodayString();
        return `<div class="modal-overlay overlay"><div class="modal-box"><h3 style="font-weight:700; margin-top:0;">${isNew?'📝 メモ・日記を追加':'編集'}</h3>
        <label style="font-size:12px; font-weight:700; color:var(--text-sub);">日付</label><input type="date" id="mod-date" value="${item.date || todayStr}">
        <label style="font-size:12px; font-weight:700; color:var(--text-sub);">公開設定</label><select id="mod-visibility"><option value="hidden" ${item.visibility==='hidden'?'selected':''}>🔒 非公開 (自分のみ)</option><option value="visible" ${item.visibility==='visible'||isNew?'selected':''}>🔓 公開 (共有相手も閲覧可)</option></select>
        <label style="font-size:12px; font-weight:700; color:var(--text-sub);">内容 (格言・一言など)</label><textarea id="mod-title" rows="4" placeholder="今日事今日畢">${item.title||''}</textarea>
        <div class="grid-2" style="margin-top:10px;"><button class="btn btn-secondary btn-full" onclick="App.closeModal()">キャンセル</button><button class="btn btn-primary btn-full" onclick="App.saveModalItem()">保存</button></div></div></div>`;
    }

    const isEdu = ctx.category === 'history'; const isSkill = ctx.category === 'skills'; const isPlan = ctx.category === 'plans';
    const stageOptions = STAGES.map(s => `<option value="${s}" ${item.stage===s?'selected':''}>${s}</option>`).join('');
    const dimOptions = SKILL_DIMS.map(s => `<option value="${s}" ${item.dim===s?'selected':''}>${s}</option>`).join('');
    
    return `<div class="modal-overlay overlay"><div class="modal-box"><h3 style="font-weight:700; margin-top:0;">${isNew?'新規追加':'編集'}</h3>
    <label style="font-size:12px; font-weight:700; color:var(--text-sub);">ライフステージ</label><select id="mod-stage">${stageOptions}</select>
    ${isEdu ? `<label style="font-size:12px; font-weight:700; color:var(--text-sub);">区分・状態 (学歴・職歴)</label><select id="mod-edu-status"><optgroup label="学歴"><option value="入学" ${item.eduStatus==='入学'?'selected':''}>入学</option><option value="卒業" ${item.eduStatus==='卒業'?'selected':''}>卒業</option><option value="卒業見込み" ${item.eduStatus==='卒業見込み'?'selected':''}>卒業見込み</option><option value="中退" ${item.eduStatus==='中退'?'selected':''}>中退</option></optgroup><optgroup label="職歴"><option value="入社" ${item.eduStatus==='入社'?'selected':''}>入社</option><option value="退社" ${item.eduStatus==='退社'?'selected':''}>退社</option><option value="現在に至る" ${item.eduStatus==='現在に至る'?'selected':''}>現在に至る</option><option value="" ${!item.eduStatus?'selected':''}>その他 (状態なし)</option></optgroup></select>` : ''}
    ${isSkill ? `<label style="font-size:12px; font-weight:700; color:var(--text-sub);">能力カテゴリー (レーダーチャート用)</label><select id="mod-skill-dim">${dimOptions}</select>` : ''}
    ${isPlan ? `<label style="font-size:12px; font-weight:700; color:var(--text-sub);">公開設定</label><select id="mod-visibility"><option value="hidden" ${item.visibility==='hidden'?'selected':''}>🔒 非公開 (自分のみ)</option><option value="visible" ${item.visibility==='visible'||isNew?'selected':''}>🔓 公開 (共有相手も閲覧可)</option></select>` : ''}
    <div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">年 (西暦)</label><input type="number" id="mod-year" value="${item.year||''}" placeholder="2026" max="2100"></div><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">月</label><input type="number" id="mod-month" value="${item.month||''}" placeholder="4" min="1" max="12"></div></div>
    <label style="font-size:12px; font-weight:700; color:var(--text-sub);">内容 / タイトル</label><input type="text" id="mod-title" value="${item.title||''}" placeholder="入力してください"><label style="font-size:12px; font-weight:700; color:var(--text-sub);">詳細・備考</label><textarea id="mod-desc" rows="4">${item.desc||''}</textarea>
    <div class="grid-2" style="margin-top:10px;"><button class="btn btn-secondary btn-full" onclick="App.closeModal()">キャンセル</button><button class="btn btn-primary btn-full" onclick="App.saveModalItem()">保存</button></div></div></div>`;
  },

  triggerPrintMode() {
    this.state.printFilter = { 
        history: Array.from(document.getElementById('export-history-list')?.querySelectorAll('input:checked') || []).map(i => i.value), 
        skills: Array.from(document.getElementById('export-skills-list')?.querySelectorAll('input:checked') || []).map(i => i.value) 
    };
    this.saveData(); 
    this.trackEvent('print_jis');
    this.state.view = 'preview'; 
    this.render();
    setTimeout(() => window.print(), 800);
  },

  templatePrintPreview() {
    const p = this.getProfile(); const b = p.basic; const fIds = this.state.printFilter || { history:[], skills:[] };
    const hFilter = fIds.history || p.history.map(i=>i.id); const sFilter = fIds.skills || p.skills.map(i=>i.id);
    
    const allH = p.history.filter(i => hFilter.includes(i.id)).sort((a,b)=>a.year-b.year || a.month-b.month);
    const eduStatuses = ['入学', '卒業', '卒業見込み', '中退'];
    const eduItems = allH.filter(i => eduStatuses.includes(i.eduStatus));
    const workItems = allH.filter(i => !eduStatuses.includes(i.eduStatus));
    const sItems = p.skills.filter(i => sFilter.includes(i.id)).sort((a,b)=>a.year-b.year || a.month-b.month);
    
    const yyyy = new Date().getFullYear();
    const mm = new Date().getMonth() + 1;
    const dd = new Date().getDate();
    let age = 0;
    if (b.birthday) {
        const birthDate = new Date(b.birthday);
        age = yyyy - birthDate.getFullYear();
        if (mm < birthDate.getMonth() + 1 || (mm === birthDate.getMonth() + 1 && dd < birthDate.getDate())) {
            age--;
        }
    }
    
    const printDate = `${App.toJapaneseEra(yyyy)}年 ${mm}月 ${dd}日 現在`;
    const birthStr = b.birthday ? `${App.toJapaneseEra(b.birthday.split('-')[0])}年 ${b.birthday.split('-')[1]}月 ${b.birthday.split('-')[2]}日生 （満 ${age} 歳）` : '';

    let hRowsData = [];
    if (eduItems.length > 0) {
        hRowsData.push({ year: '', month: '', text: '学　歴', align: 'center' });
        eduItems.forEach(i => hRowsData.push({ year: App.toJapaneseEra(i.year), month: i.month, text: `${i.title} ${i.eduStatus||''}` }));
    }
    if (workItems.length > 0) {
        if (eduItems.length > 0) hRowsData.push({ year: '', month: '', text: '' }); 
        hRowsData.push({ year: '', month: '', text: '職　歴', align: 'center' });
        workItems.forEach(i => hRowsData.push({ year: App.toJapaneseEra(i.year), month: i.month, text: `${i.title} ${i.eduStatus||''}` }));
    }
    if (hRowsData.length > 0) {
        hRowsData.push({ year: '', month: '', text: '以上', align: 'right' });
    }

    let p1Rows = '';
    for(let i=0; i<16; i++) {
        let r = hRowsData[i] || { year:'', month:'', text:'', align:'left' };
        let alignStyle = r.align ? `text-align:${r.align};` : '';
        p1Rows += `<tr style="height:7.5mm;"><td class="txt-center col-year">${r.year}</td><td class="txt-center col-month">${r.month||''}</td><td class="col-content" style="${alignStyle}">${r.text}</td></tr>`;
    }

    let p2Rows = '';
    for(let i=16; i<22; i++) {
        let r = hRowsData[i] || { year:'', month:'', text:'', align:'left' };
        let alignStyle = r.align ? `text-align:${r.align};` : '';
        p2Rows += `<tr style="height:7.5mm;"><td class="txt-center col-year border-none-top">${r.year}</td><td class="txt-center col-month border-none-top">${r.month||''}</td><td class="col-content border-none-top" style="${alignStyle}">${r.text}</td></tr>`;
    }

    let sRowsData = [];
    sItems.forEach(i => sRowsData.push({ year: App.toJapaneseEra(i.year), month: i.month, text: i.title }));
    if (sRowsData.length > 0) sRowsData.push({ year: '', month: '', text: '以上', align: 'right' });
    
    let p2Skills = '';
    for(let i=0; i<6; i++) {
        let r = sRowsData[i] || { year:'', month:'', text:'', align:'left' };
        let alignStyle = r.align ? `text-align:${r.align};` : '';
        p2Skills += `<tr style="height:7.5mm;"><td class="txt-center col-year">${r.year}</td><td class="txt-center col-month">${r.month||''}</td><td class="col-content" style="${alignStyle}">${r.text}</td></tr>`;
    }

    return `<div class="resume-preview-wrapper">
      <div class="print-actions"><button class="btn btn-secondary" onclick="App.state.view='app'; App.render()">戻る</button><button class="btn btn-primary" onclick="window.print()">印刷実行</button></div>
      
      <!-- PAGE 1 -->
      <div class="jis-page">
        <div class="jis-header">
          <div class="jis-title">履 歴 書</div><div class="jis-date">${printDate}</div>
        </div>
        <table class="jis-table" style="margin-bottom:0; border-bottom:none;">
          <tr>
            <td colspan="5" class="border-dash" style="padding:2px 8px; font-size:9pt;">ふりがな　${b.furigana||''}</td>
            <td rowspan="3" style="width:38mm; padding:0; text-align:center; vertical-align:middle; border-left: 2px solid black;">
              ${b.photo ? `<img src="${b.photo}" style="width:100%; height:100%; object-fit:cover;">` : `<div style="font-size:8pt; color:#666; line-height:1.4;">写真をはる位置<br>1.縦 36mm〜40mm<br>横 24mm〜30mm<br>2.本人単身胸から上<br>3.裏面のりづけ</div>`}
            </td>
          </tr>
          <tr>
            <td colspan="5" style="font-size:24pt; font-weight:bold; height:18mm; vertical-align:middle; padding-left:20mm; letter-spacing: 10px;">氏 名<span style="margin-left:20mm;">${p.name||''}</span></td>
          </tr>
          <tr>
            <td colspan="3" style="height:10mm; vertical-align:middle; font-size:11pt;">${birthStr}</td>
            <td colspan="2" style="font-size:10pt; vertical-align:top; padding:2px;">
               <div style="font-size:7pt; color:#333;">※「性別」欄:記載は任意です。未記載とすることも可能です。</div>
               <div style="text-align:center; margin-top:2px;">${b.gender === 'male' ? '男' : (b.gender === 'female' ? '女' : '')}</div>
            </td>
          </tr>
        </table>
        <table class="jis-table" style="border-top: none; margin-bottom: 5mm;">
          <tr>
            <td colspan="4" class="border-dash border-none-top" style="font-size:9pt; width:70%;">ふりがな　</td>
            <td colspan="2" class="border-dash border-none-top" style="font-size:9pt; width:30%;">電話</td>
          </tr>
          <tr>
            <td colspan="4" style="height:18mm; vertical-align:top;">現住所　〒 ${b.postalCode||''}<br>${b.address||''}</td>
            <td colspan="2" style="vertical-align:top;">${b.phone||''}<br><br><span style="font-size:9pt;">Email: ${b.email||''}</span></td>
          </tr>
          <tr>
            <td colspan="4" class="border-dash" style="font-size:9pt;">ふりがな　</td>
            <td colspan="2" class="border-dash" style="font-size:9pt;">電話</td>
          </tr>
          <tr>
            <td colspan="4" style="height:18mm; vertical-align:top;">連絡先（現住所以外に連絡を希望する場合のみ記入）　〒 ${b.contactPostalCode||''}<br>${b.contactAddress||'同上'}</td>
            <td colspan="2" style="vertical-align:top;">${b.contactPhone||''}</td>
          </tr>
        </table>
        
        <table class="jis-table" style="margin-bottom:0;">
          <colgroup><col class="col-year"><col class="col-month"><col class="col-content"></colgroup>
          <tr style="height:7mm;"><th class="col-year">年</th><th class="col-month border-none-top">月</th><th class="col-content border-none-top">学歴・職歴（各別にまとめて書く）</th></tr>
          ${p1Rows}
        </table>
      </div>

      <!-- PAGE 2 -->
      <div class="jis-page">
        <table class="jis-table" style="border-bottom: none; margin-bottom:0;">
          <colgroup><col class="col-year"><col class="col-month"><col class="col-content"></colgroup>
          ${p2Rows}
        </table>
        <table class="jis-table" style="margin-bottom:5mm;">
          <colgroup><col class="col-year"><col class="col-month"><col class="col-content"></colgroup>
          <tr style="height:7mm;"><th class="col-year">年</th><th class="col-month">月</th><th class="col-content">免許・資格</th></tr>
          ${p2Skills}
        </table>
        
        <table class="jis-table" style="margin-bottom:5mm;">
          <tr><td class="box-large"><b>志望の動機、特技、好きな学科、アピールポイントなど</b><br><br>${b.motivation||''}</td></tr>
        </table>
        
        <table class="jis-table">
          <tr><td class="box-medium"><b>本人希望記入欄（特に給料・職種・勤務時間・勤務地・その他についての希望などがあれば記入）</b><br><br>${b.desiredConditions||''}</td></tr>
        </table>
      </div>
    </div>`;
  }
};
window.onload = () => App.init();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const fbConfig = {
    "apiKey": "AIzaSyCU8FG-bGYIm5eX3RbEUNK8_UO3k1oXwyw",
    "authDomain": "curriculum-vitae-76c2b.firebaseapp.com",
    "projectId": "curriculum-vitae-76c2b",
    "storageBucket": "curriculum-vitae-76c2b.firebasestorage.app",
    "messagingSenderId": "556917387273",
    "appId": "1:556917387273:web:9e36b3f666d566e64288d8"
  };

  const app = initializeApp(fbConfig); const auth = getAuth(app); const db = getFirestore(app); 
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  window.CloudSync = { isLoggedIn: false, user: null, pauseSync: false, isPulling: false, isPushingMain: false, isPushingShared: null, unsubShared: {} };

  onAuthStateChanged(auth, async (user) => {
    if (user) { 
      window.CloudSync.isLoggedIn = true; window.CloudSync.user = user; 
      
      if(App.isLocalDefault()) {
          try {
              const s = await getDoc(doc(db, 'users', user.uid, 'life_resume', 'mainData'));
              if(s.exists()) {
                  App.data = JSON.parse(s.data().data);
                  localStorage.setItem(App.DB_KEY, JSON.stringify(App.data));
              }
          } catch(e) {}
      }
      
      window.CloudSync.listenToMainData();
      window.CloudSync.listenToSharedProfiles();

      if(typeof App !== 'undefined' && App.render) App.render();
    } else {
      window.CloudSync.isLoggedIn = false; window.CloudSync.user = null;
      if(window.CloudSync.unsubMain) window.CloudSync.unsubMain();
      Object.keys(window.CloudSync.unsubShared).forEach(k => window.CloudSync.unsubShared[k]());
      window.CloudSync.unsubShared = {};
      
      if(typeof App !== 'undefined' && App.render) App.render();
    }
  });

  window.CloudSync.listenToMainData = () => {
      if(window.CloudSync.unsubMain) return; 
      window.CloudSync.unsubMain = onSnapshot(doc(db, 'users', auth.currentUser.uid, 'life_resume', 'mainData'), (s) => {
          if (window.CloudSync.isPushingMain || window.CloudSync.pauseSync) return;
          if(s.exists()) {
              const cloudData = JSON.parse(s.data().data);
              if (cloudData.settings.lastSync > (App.data.settings.lastSync || 0)) {
                  window.CloudSync.isPulling = true;
                  App.data = cloudData;
                  localStorage.setItem(App.DB_KEY, JSON.stringify(App.data));
                  App.render();
                  window.CloudSync.isPulling = false;
                  window.CloudSync.listenToSharedProfiles(); 
              }
          }
      }, (err) => console.warn("Main sync error:", err));
  };

  window.CloudSync.listenToSharedProfiles = () => {
      Object.values(App.data.profiles).forEach(p => {
          if(p.shareCode && !window.CloudSync.unsubShared[p.shareCode]) {
              window.CloudSync.unsubShared[p.shareCode] = onSnapshot(doc(db, 'shared_profiles', p.shareCode), (s) => {
                  if (window.CloudSync.isPushingShared === p.shareCode) return; 
                  if(s.exists()) {
                      const remoteData = JSON.parse(s.data().data);
                      const localP = App.data.profiles[p.id];
                      if (!localP || remoteData._lastUpdate > (localP._lastUpdate || 0)) {
                          window.CloudSync.isPulling = true;
                          const localId = p.id;
                          App.data.profiles[localId] = { ...remoteData, id: localId, role: localP ? localP.role : 'child' }; 
                          localStorage.setItem(App.DB_KEY, JSON.stringify(App.data));
                          if (App.state.activeProfileId === localId) {
                              App.render();
                          }
                          window.CloudSync.isPulling = false;
                      }
                  }
              }, (err) => console.warn("Shared sync error:", err));
          }
      });
  };

  window.CloudSync.login = async () => {
      try {
          const result = await signInWithPopup(auth, provider);
          await window.CloudSync.checkConflict(result.user);
      } catch(e) {
          if (e.code !== 'auth/popup-closed-by-user') alert(e.message);
      }
  };

  window.CloudSync.checkConflict = async (user) => {
      App.state.dialog = { type: 'loading', message: 'クラウドデータを確認中...' };
      App.render();
      try {
          const s = await getDoc(doc(db, 'users', user.uid, 'life_resume', 'mainData'));
          if (s.exists()) {
              const cloudData = JSON.parse(s.data().data);
              if (App.isLocalDefault()) {
                  App.data = cloudData;
                  localStorage.setItem(App.DB_KEY, JSON.stringify(cloudData));
                  App.state.dialog = null;
                  App.showAlert("クラウドからデータを自動復元しました。");
              } else {
                  window.CloudSync.pauseSync = true; 
                  App.state.dialog = { type: 'sync_conflict', cloudData: cloudData, message: '⚠️ データの競合を検出しました\n\n現在の端末とクラウドの両方にデータが存在します。\nどちらのデータを優先しますか？' };
                  App.render();
              }
          } else {
              App.state.dialog = null;
              App.showAlert("クラウド連携が完了しました。現在のデータをバックアップします。");
              App.triggerBackgroundSync();
          }
      } catch(e) { App.state.dialog = null; App.showAlert("エラーが発生しました: " + e.message); }
  };
  
  window.CloudSync.logout = () => {
      signOut(auth).then(() => { App.showAlert("Googleアカウントの連携を解除しました。"); }).catch(e => alert(e.message));
  };
  
  window.CloudSync.backup = async (d) => {
    if(!auth.currentUser) return {success:false};
    try { await setDoc(doc(db, 'users', auth.currentUser.uid, 'life_resume', 'mainData'), { data: JSON.stringify(d), ts: serverTimestamp() }); return {success:true}; }
    catch(e){ return {success:false, msg:e.message}; }
  };

  window.CloudSync.updateSharedProfile = async (profileData) => {
      try {
          await setDoc(doc(db, 'shared_profiles', profileData.shareCode), {
              data: JSON.stringify(profileData),
              ts: serverTimestamp()
          }, { merge: true });
      } catch(e) {}
  };

  window.CloudSync.createShareLink = async (profileData) => {
      if(!auth.currentUser) return {success:false, msg:"ログインしてください"};
      try {
          const shareCode = profileData.shareCode;
          await setDoc(doc(db, 'shared_profiles', shareCode), {
              ownerUid: auth.currentUser.uid,
              data: JSON.stringify(profileData),
              ts: serverTimestamp()
          });
          return { success: true, code: shareCode };
      } catch(e) { return { success: false, msg: e.message }; }
  };

  window.CloudSync.fetchSharedProfile = async (code) => {
      if(!auth.currentUser) return {success:false, msg:"ログインしてください"};
      try {
          const s = await getDoc(doc(db, 'shared_profiles', code.toUpperCase()));
          if(s.exists()) { return { success: true, data: JSON.parse(s.data().data) }; }
          return { success: false, msg: "共有データが見つかりません" };
      } catch(e) { return { success: false, msg: e.message }; }
  };
</script>
</body>
</html>
