  <style>
    /* =========================================
       1. 現代美學設計系統 (Modern Design System)
       ========================================= */
    :root {
      --primary: #0f766e;
      --primary-light: #14b8a6;
      --primary-dark: #115e59;
      --primary-gradient: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #14b8a6 100%);
      
      --plan-my: #6366f1;
      --plan-parent: #f59e0b;
      --skill-color: #10b981;
      --achieve-color: #f97316;
      --birth-color: #ec4899;
      --diary-color: #3b82f6;
      
      --bg-color: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(226, 232, 240, 0.85);
      --glass-bg: rgba(255, 255, 255, 0.85);
      
      --text-main: #1e293b;
      --text-sub: #64748b;
      --text-muted: #94a3b8;
      
      --border: #e2e8f0;
      --border-focus: #0d9488;
      --danger: #ef4444;
      --success: #10b981;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }
    *, *::before, *::after { box-sizing: inherit; }
    
    .container { max-width: 1060px; margin: 0 auto; padding: 20px 16px; padding-bottom: 120px; }
    
    /* Modern Glass Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark);
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-top: 0;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Stats & Radar Chart */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-box {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      padding: 16px 12px;
      border-radius: var(--radius-sm);
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .stat-box:hover { transform: translateY(-2px); border-color: var(--primary-light); }
    .stat-val { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.02em; }
    .stat-label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-top: 4px; }
    .chart-container { position: relative; height: 280px; width: 100%; margin-bottom: 10px; }

    /* Buttons */
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary-gradient); color: white; }
    .btn-primary:hover { box-shadow: 0 4px 12px rgba(15, 118, 110, 0.35); }
    .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fecaca; }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
    .btn-google { background: #ffffff; color: #334155; border: 1px solid #cbd5e1; }
    .btn-lang { background: #ffffff; color: var(--primary-dark); border: 1px solid var(--border); font-size: 12px; padding: 6px 12px; border-radius: var(--radius-full); font-weight: 700; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }

    /* Inputs */
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      margin-bottom: 14px;
      background: #ffffff;
      color: var(--text-main);
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    input:disabled, select:disabled, textarea:disabled { background-color: #f8fafc; color: var(--text-muted); cursor: not-allowed; }
    input[type="checkbox"], input[type="radio"] { transform: scale(1.2); margin-right: 8px; cursor: pointer; width: auto; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .hidden { display: none !important; }

    /* Header with Blur */
    .header {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 24px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      color: var(--primary-dark);
    }
    .sync-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: #f1f5f9;
      border: 1px solid var(--border);
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .sync-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .sync-dot.syncing { background: #8b5cf6; animation: blink 1s infinite; box-shadow: 0 0 8px #8b5cf6; }
    @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } }

    /* Modern Segmented Pill Tabs (完全解決切邊問題) */
    .tabs-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 24px;
      padding: 8px 16px 8px 8px;
      background: #f1f5f9;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scroll-snap-type: x proximity;
    }
    .tab {
      padding: 10px 18px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: var(--radius-sm);
      white-space: nowrap;
      flex-shrink: 0;
      scroll-snap-align: start;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab:hover { color: var(--primary); background: rgba(255,255,255,0.6); }
    .tab.active {
      color: var(--primary-dark);
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-weight: 700;
    }

    /* Timeline Filter Chips */
    .timeline-filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .timeline-filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #f1f5f9;
      color: var(--text-sub);
      border: 1px solid var(--border);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.3);
    }

    /* Timeline & Lists */
    .list-item {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .list-item:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }
    .item-content { flex: 1; cursor: pointer; }
    .item-meta { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; display: flex; gap: 8px; align-items: center;}
    .item-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; color: var(--text-main); }
    .item-desc { font-size: 13.5px; color: #475569; line-height: 1.5; white-space: pre-wrap; }
    
    .tag { padding: 3px 10px; border-radius: var(--radius-full); font-size: 11px; color: white; font-weight: 700; letter-spacing: 0.02em; }
    .badge-success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; padding: 3px 10px; border-radius: var(--radius-full); font-size: 11px; font-weight: 700; }

    .timeline-dual { position: relative; margin: 20px 0; padding: 10px 0; }
    .timeline-dual::after { content: ''; position: absolute; width: 4px; background: linear-gradient(180deg, #cbd5e1 0%, #e2e8f0 100%); top: 0; bottom: 0; left: 50%; transform: translateX(-50%); border-radius: 4px; }
    .tl-container { padding: 12px 32px; position: relative; width: 50%; box-sizing: border-box; }
    .tl-left { left: 0; text-align: right; }
    .tl-right { left: 50%; text-align: left; }
    .tl-dot { position: absolute; width: 16px; height: 16px; background-color: white; top: 22px; border-radius: 50%; z-index: 2; border: 4px solid; box-shadow: 0 0 0 3px rgba(255,255,255,0.8); }
    .tl-left .tl-dot { right: -8px; }
    .tl-right .tl-dot { left: -8px; }
    .tl-content { padding: 18px; background: white; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; }
    .tl-content:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

    .photo-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; cursor: zoom-in; transition: transform 0.2s; }
    .photo-thumb:hover { transform: scale(1.05); }
    .profile-photo-area { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px; border: 2px dashed var(--border); border-radius: var(--radius); background: #f8fafc; }
    .profile-photo-img { width: 110px; height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; cursor: zoom-in; box-shadow: var(--shadow-md); }

    /* Life Progress Hero */
    .life-hero {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 45%, #14b8a6 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.4);
      position: relative;
      overflow: hidden;
    }
    .life-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
    }
    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.25);
      height: 12px;
      border-radius: 12px;
      margin-top: 16px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #fde047 0%, #4ade80 50%, #38bdf8 100%);
      border-radius: 12px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(253, 224, 71, 0.5);
    }

    /* PWA Install Banner */
    .pwa-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      padding: 14px 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }

    /* Floating Action Button (FAB) */
    .fab-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.45);
      border: none;
      cursor: pointer;
      z-index: 99;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fab-btn:hover { transform: scale(1.1) rotate(90deg); }

    /* Canvas Floating Controls */
    .canvas-control-bar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      z-index: 10;
    }
    .canvas-ctrl-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s;
    }
    .canvas-ctrl-btn:hover { background: #f1f5f9; color: var(--primary); }

    /* Image Viewer (Lightbox) */
    .image-viewer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); z-index: 3000; display: flex; justify-content: center; align-items: center; cursor: zoom-out; }
    .image-viewer-img { max-width: 92%; max-height: 92%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); object-fit: contain; }

    /* Export Selector */
    .export-check-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #f8fafc; margin-bottom: 10px; }
    .export-check-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 13px; }
    .export-check-item input[type="checkbox"] { margin: 0 8px 0 0; width: 16px; height: 16px; }

    /* Overlays & Loaders */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(6px); z-index: 2000; display: flex; justify-content: center; align-items: center; overflow-y: auto; padding:20px;}
    .dialog-box { background: white; padding: 32px; border-radius: var(--radius-lg); width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); margin:auto; }
    .modal-box { background: white; padding: 28px; border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .custom-dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(6px); z-index: 9999; display: flex; justify-content: center; align-items: center; padding:20px; }
    .custom-dialog-box { background: white; padding: 28px; border-radius: var(--radius-lg); width: 100%; max-width: 380px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loader-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 44px; height: 44px; animation: spin 0.8s linear infinite; margin: 20px auto; }

    @media screen and (max-width: 680px) {
      .container { padding: 12px; }
      .header { padding: 10px 14px; }
      .timeline-dual::after { left: 16px; }
      .tl-container { width: 100%; padding-left: 36px; padding-right: 0; text-align: left !important; left: 0 !important; }
      .tl-left .tl-dot, .tl-right .tl-dot { left: 8px; }
      .tl-content { border-left-width: 4px !important; border-right-width: 1px !important; padding: 14px; }
      .grid-2 { grid-template-columns: 1fr; gap: 12px; }
      .card { padding: 18px; }
      .fab-btn { bottom: 20px; right: 20px; width: 52px; height: 52px; font-size: 22px; }
      .modal-box { padding: 20px; border-radius: var(--radius) var(--radius) 0 0; position: fixed; bottom: 0; max-height: 85vh; width: 100%; max-width: 100%; }
      .overlay { padding: 0; align-items: flex-end; }
    }

    /* =========================================
       ULTIMATE JIS R3 Print Layout (Pixel Perfect)
       ========================================= */
    .print-actions { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:9999; }
    .resume-preview-wrapper { background: #52525b; min-height: 100vh; padding: 20px 0; font-family: "MS Mincho", "Hiragino Mincho ProN", serif; color: black; }
    
    .jis-page { 
        background: white; 
        width: 210mm; 
        min-height: 297mm; 
        margin: 0 auto 20px auto; 
        padding: 15mm 15mm; 
        box-sizing: border-box; 
        position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    
    .jis-table { width: 100%; border-collapse: collapse; border: 2px solid black; margin-bottom: 5mm; table-layout: fixed; }
    .jis-table th, .jis-table td { border: 1px solid black; padding: 4px 8px; font-size: 10pt; vertical-align: middle; line-height: 1.4; }
    .jis-table th { font-weight: normal; text-align: center; }
    
    .jis-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2mm; }
    .jis-title { font-size: 18pt; font-weight: bold; letter-spacing: 5px; }
    .jis-date { font-size: 10pt; }
    
    .col-year { width: 14%; text-align: center; border-right: 1px dashed #666; }
    .col-month { width: 6%; text-align: center; }
    .col-content { width: 80%; }
    
    .txt-center { text-align: center; }
    .border-dash { border-bottom: 1px dashed black !important; }
    .border-none-bottom { border-bottom: none !important; }
    .border-none-top { border-top: none !important; }

    .box-large { height: 60mm; vertical-align: top !important; padding: 8px !important; }
    .box-medium { height: 50mm; vertical-align: top !important; padding: 8px !important; }

    @media print {
      body * { visibility: hidden; }
      .print-actions { display: none !important; }
      .resume-preview-wrapper { background: transparent; padding: 0; margin: 0; }
      .jis-page, .jis-page * { visibility: visible; }
      .jis-page { 
          position: relative; left: 0; top: 0; margin: 0; padding: 10mm 15mm; 
          box-shadow: none; border: none; page-break-after: always; height: auto; min-height: 297mm;
      }
      @page { size: A4 portrait; margin: 0; }
    }

    /* Skill Tree Container */
    #skill-network-container { width: 100%; height: 520px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; margin-bottom:15px; position: relative; }
  </style>
</head>

<div id="app-root"></div>
<div id="print-root" class="hidden"></div>

<script>
/**
 * 繁日雙語對照字典 (i18n Dictionary)
 */
const I18N = {
  zh: {

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 400; let w = img.width, h = img.height;
        if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  },

        }

ノード数は8〜15個程度にし、論理的にedgesで繋いでください。`;

      try {
          const candidateModels = [
              this.getGeminiModel(),
              'gemini-3.6-flash',
              'gemini-3.7-flash',
              'gemini-2.5-flash',
              'gemini-1.5-flash',
              'gemini-1.5-pro'
          ];
          const modelsToTry = [...new Set(candidateModels.filter(Boolean))];
          
          let lastError = null;
          let treeData = null;
          let successfulModel = null;

          for (const modelName of modelsToTry) {
              try {
                  console.log(`[AI Skill Tree] Trying model: ${modelName}...`);
                  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`, {
                      method: 'POST',
                      headers: { 
                          'Content-Type': 'application/json',
                          'X-goog-api-key': apiKey
                      },
                      body: JSON.stringify({ 
                          contents: [{ parts: [{ text: prompt }] }], 
                          generationConfig: { responseMimeType: "application/json" } 
                      })
                  });
                  
                  const result = await resp.json();
                  if (!resp.ok) {
                      const errDetail = result.error?.message || `HTTP ${resp.status} Error`;
                      lastError = new Error(`[${modelName}] ${errDetail}`);
                      console.warn(`[AI Skill Tree] Model ${modelName} failed:`, errDetail);
                      continue; // 嘗試下一個備援模型
                  }
                  
                  if (!result.candidates || result.candidates.length === 0) {
                      lastError = new Error(`[${modelName}] API はコンテンツを返しませんでした。`);
                      continue;
                  }

                  let rawText = result.candidates[0].content.parts[0].text.trim();
                  // 去除可能夾帶的 ```json ``` 區塊
                  if (rawText.startsWith('```')) {
                      rawText = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/\s*```$/, '');
                  }

                  treeData = JSON.parse(rawText);
                  successfulModel = modelName;
                  break; // 成功取得並解析資料，跳出迴圈
              } catch(modelErr) {
                  lastError = modelErr;
                  console.warn(`[AI Skill Tree] Attempt with ${modelName} failed:`, modelErr.message);
              }
          }

          if (!treeData) {
              throw lastError || new Error("すべてのAIモデルがビジー状態です。しばらく待ってから再試行してください。");
          }

          console.log(`[AI Skill Tree] Successfully generated tree using: ${successfulModel}`);
          
          if (!this.state.skillTreeCaches[pId]) this.state.skillTreeCaches[pId] = {};
          this.state.skillTreeCaches[pId][mode] = { 
              data: { nodes: treeData.nodes, edges: treeData.edges }, 
              report: treeData.report,
              modelUsed: successfulModel
          };
          this.state.skillTreeGenerating = false;
          
          this.render();
          
      } catch(e) { 
          console.error("Skill Tree Generation Error:", e);
          this.state.skillTreeGenerating = false; 
          this.render(); 
          this.showAlert("生成失敗，原因：\n" + e.message + "\n\n(目前 Google 伺服器流量較大，已為您自動嘗試備援模型。請稍候 5~10 秒後再次點擊即可！)"); 
      }

  drawSkillTree(nodesData, edgesData) {
      const container = document.getElementById('skill-network-container');
      if (!container || typeof vis === 'undefined') return;
      
      const p = this.getProfile();
      
      const acquiredNames = [
          ...p.history.map(i => i.title),
          ...p.skills.map(i => i.title),
          ...(p.achievements || []).map(i => i.title)
      ].join(' ').toLowerCase(); 

      const nodes = new vis.DataSet(nodesData.map(n => {
          let color, shape = 'box', fontColor = '#ffffff';
          
          let currentGroup = n.group;
          if (currentGroup === 'pending' && acquiredNames.includes(n.label.toLowerCase())) {
              currentGroup = 'acquired';
          }

          if(currentGroup === 'acquired') { color = { background: '#10b981', border: '#059669' }; }
          else if(currentGroup === 'pending') { color = { background: '#f59e0b', border: '#d97706' }; }
          else if(currentGroup === 'target') { shape = 'star'; color = { background: '#6366f1', border: '#4f46e5' }; fontColor = '#312e81'; }
          
          return {
            ...n, color: color, shape: shape,
            font: { color: fontColor, size: 14, bold: true, face: 'Inter, Noto Sans TC, Noto Sans JP' },
            shadow: { enabled: true, color: 'rgba(0,0,0,0.12)', size: 8, x: 2, y: 4 },
            margin: 10,
            borderWidth: 2
          };
      }));

      const edges = new vis.DataSet(edgesData.map(e => ({
          ...e, 
          width: 2.5, 
          color: { color: '#cbd5e1', highlight: '#6366f1' }, 
          arrows: 'to', 
          smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 }
      })));

      const data = { nodes: nodes, edges: edges };
      
      const options = {
          physics: {
              enabled: true,
              solver: 'barnesHut',
              barnesHut: { 
                  gravitationalConstant: -2800, 
                  centralGravity: 0.1,         
                  springLength: 130,           
                  springConstant: 0.04,        
                  damping: 0.09                
              },
              stabilization: false 
          },
          layout: { randomSeed: 42 }, 
          interaction: { hover: true, tooltipDelay: 200 }
      };

      if (this.networkInstance) {
          this.networkInstance.destroy();
      }
      this.networkInstance = new vis.Network(container, data, options);

      this.networkInstance.on("selectNode", (params) => {
          const nodeId = params.nodes[0];
          const node = nodes.get(nodeId);
          if (node && node.color.background === '#f59e0b') {
              App.showConfirm(`💡 未習得スキルを発見：【${node.label}】\n\nAIのアドバイス：${node.title}\n\nこのタスクを「目標・プラン」リストに追加しますか？`, () => {
                  const p = App.getProfile();
                  if(!p.plans) p.plans = [];
                  p.plans.push({
                      id: 'item_' + Date.now(),
                      year: new Date().getFullYear(), month: new Date().getMonth() + 1,
                      title: `[AI提案] ${node.label}`,
                      desc: node.title,
                      stage: '全期間共通', status: 'active', author: App.state.loginProfileId, visibility: 'visible'
                  });
                  App.saveData();
                  App.showAlert("✅ 目標リストに追加しました！この目標を達成すると、スキルツリーのノードが自動的に緑色に変わります。");
                  App.render();
              });
          }
      });
  },

  /* === 核心渲染邏輯 === */
  render() {
    const root = document.getElementById('app-root');
    let html = (this.state.view === 'login') ? this.templateLogin() : (this.state.view === 'preview' ? this.templatePrintPreview() : this.templateApp());
    if (this.state.modalContext && this.state.view === 'app') html += this.templateModal();
    if (this.state.dialog) html += this.templateDialog();
    if (this.state.viewImageSrc) html += this.templateImageViewer(); 
    root.innerHTML = html;
    this.updateHeaderSyncUI();

    if (this.state.view === 'app') {
        if (this.state.activeTab === 'overview') {
            setTimeout(() => App.drawRadarChart(), 100);
        }
        
        if (this.state.activeTab === 'skilltree') {
            const pId = this.state.activeProfileId;
            const mode = this.state.skillTreeMode;
            const cache = this.state.skillTreeCaches[pId]?.[mode];
            
            if (cache && cache.data && !this.state.skillTreeGenerating) {
                setTimeout(() => App.drawSkillTree(cache.data.nodes, cache.data.edges), 100);
            } else if (this.networkInstance) {
                this.networkInstance.destroy();
                this.networkInstance = null;
            }
        }

  templateDialog() {

        btns = `<div class="grid-2"><button class="btn btn-secondary btn-full" onclick="App.state.dialog.onCancel()">キャンセル</button><button class="btn btn-primary btn-full" onclick="App.state.dialog.onConfirm()">確定</button></div>`;

        btns = `<div class="grid-2"><button class="btn btn-secondary btn-full" onclick="App.state.dialog=null; App.render()">キャンセル</button><button class="btn btn-success btn-full" onclick="App.confirmCompletePlan('${d.planId}', document.getElementById('complete-cat-select').value)">実績に追加</button></div>`;

  templateLogin() {
    const mainId = this.data.settings.mainProfileId || 'parent_self';
    const mainProf = this.data.profiles[mainId];
    const otherIds = Object.keys(this.data.profiles).filter(k => k !== mainId);

    if (!this.state.loginProfileId) {
        let loginBtns = '';
        if (mainProf) {
            loginBtns += `<button class="btn btn-primary btn-full" style="margin-bottom:14px; padding:16px; font-size:16px;" onclick="App.state.loginProfileId='${mainId}'; App.executeLogin()">👤 ${mainProf.name} (メイン) ログイン</button>`;
        }
        otherIds.forEach(id => {
            const prof = this.data.profiles[id];
            if (!prof.isClaimed) {
                loginBtns += `<button class="btn btn-secondary btn-full" style="margin-bottom:12px; padding:14px; font-size:15px;" onclick="App.state.loginProfileId='${id}'; App.executeLogin()">🌱 ${prof.name} (お子様) ログイン</button>`;
            } else {
                loginBtns += `<button class="btn btn-secondary btn-full" style="margin-bottom:12px; padding:14px; font-size:15px;" onclick="App.state.loginProfileId='${id}'; App.executeLogin()">🔗 ${prof.name} (共有) ログイン</button>`;
            }
        });

        return `<div class="overlay"><div class="dialog-box" style="text-align:center;">
        <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
          <button class="btn btn-lang btn-sm" onclick="App.toggleLanguage()">${(this.data.settings.lang==='zh')?'🇹🇼 繁體中文 ➔ 🇯🇵 日本語':'🇯🇵 日本語 ➔ 🇹🇼 繁體中文'}</button>
        </div>
        <div style="font-size:36px; margin-bottom:8px;">📖</div>
        <h2 style="font-weight:800; color:var(--primary-dark); margin-top:0; margin-bottom:6px; letter-spacing:-0.02em;">${this.t('appTitle')}</h2>
        <div style="font-size:12px; color:var(--text-sub); margin-bottom:24px; font-weight:600;">V3.0 Pro PWA Edition</div>
        ${loginBtns}
        <div style="margin-top:28px; border-top:1px dashed var(--border); padding-top:20px;">
          <p style="font-size:12px; color:var(--text-sub); margin-bottom:12px; font-weight:500;">オフライン・データ移行</p>
          <button class="btn btn-secondary btn-full btn-sm" onclick="document.getElementById('login-import-json').click()">📁 ローカルデータを復元 (.json)</button>
          <input type="file" id="login-import-json" class="hidden" accept=".json" onchange="App.importLocalData(event)">
        </div></div></div>`;

    <input type="password" id="login-pwd" placeholder="パスワードを入力" style="text-align:center; margin-bottom:16px; font-size:16px; letter-spacing:4px;">
    <div class="grid-2">
    <button class="btn btn-secondary btn-full" onclick="App.state.loginProfileId=''; App.render()">戻る</button>
    <button class="btn btn-primary btn-full" onclick="App.executeLogin()">ログイン</button>
    </div></div></div>`;
  },

  templateApp() {
    const p = this.getProfile(); 
    const mainId = this.data.settings.mainProfileId || 'parent_self';
    const otherIds = Object.keys(this.data.profiles).filter(k => k !== mainId);
    
    const b = p.basic; const age = b.birthday ? Math.floor((Date.now() - new Date(b.birthday).getTime()) / 31557600000) : 0;
    const lifeBase = b.gender === 'female' ? 87 : 81; const lifePct = Math.min(100, Math.round((age / lifeBase) * 100));

    let stageTitle = this.t('stage1');
    if (age >= 23 && age <= 35) stageTitle = this.t('stage2');
    else if (age >= 36 && age <= 50) stageTitle = this.t('stage3');
    else if (age >= 51 && age <= 65) stageTitle = this.t('stage4');
    else if (age >= 66) stageTitle = this.t('stage5');

    let profileSelect = '';
    if (this.state.loginProfileId === mainId) {
        profileSelect = `<select onchange="App.switchProfile(this.value)" style="width:auto; margin:0; padding:8px 12px; font-size:13px; font-weight:600;">
            <option value="${mainId}" ${p.id === mainId ? 'selected' : ''}>👤 ${this.data.profiles[mainId].name}</option>
            ${otherIds.map(id => {
                const pr = this.data.profiles[id];
                const label = pr.isClaimed ? '共有' : 'お子様';
                return `<option value="${id}" ${p.id === id ? 'selected' : ''}>🌱 ${pr.name} (${label})</option>`;
            }).join('')}
        </select><button class="btn btn-primary btn-sm" onclick="App.addChild()">${this.t('addChild')}</button>`;
    } else {
        profileSelect = `<span class="tag" style="background:var(--primary); font-size:12px; padding:6px 12px;">${p.name}</span>`;
    }

    const tabsList = [
      ['overview', this.t('overview')],
      ['basic', this.t('basic')],
      ['history', this.t('history')],
      ['skills', this.t('skills')],
      ['achievements', this.t('achievements')],
      ['diary', this.t('diary')],
      ['plans', this.t('plans')],
      ['skilltree', this.t('skilltree')],
      ['settings', this.t('settings')]
    ];

    return `
    <div class="header">
      <div class="user-badge">
        <span>📖 ${p.name}</span>
        <div id="sync-indicator" class="sync-indicator"></div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-lang btn-sm" onclick="App.toggleLanguage()" title="語言切換 / 言語切替">${(this.data.settings.lang==='zh')?'🇹🇼 繁中':'🇯🇵 日本語'}</button>
        ${profileSelect}
        <button class="btn btn-secondary btn-sm" onclick="App.logout()">${this.t('logout')}</button>
      </div>
    </div>

    <div class="container">
      ${this.state.showPwaBanner ? `
      <div class="pwa-banner">
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="font-size:24px;">📱</span>
          <div>
            <div style="font-weight:700; font-size:14px;">${this.t('pwaBannerTitle')}</div>
            <div style="font-size:12px; opacity:0.9;">${this.t('pwaBannerDesc')}</div>
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm btn-secondary" onclick="App.state.showPwaBanner=false; App.render()">${this.t('laterBtn')}</button>
          <button class="btn btn-sm btn-success" onclick="App.promptPwaInstall()">${this.t('installBtn')}</button>
        </div>
      </div>` : ''}

      <!-- LIFE PROGRESS HERO -->
      <div class="life-hero">
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
          <div>
            <div style="font-size:11px; font-weight:800; letter-spacing:1.5px; opacity:0.85; margin-bottom:4px;">${this.t('lifeProgress')}</div>
            <div style="font-size:28px; font-weight:900; letter-spacing:-0.02em;">${age} <span style="font-size:16px; font-weight:500; opacity:0.9;">${this.t('ageSuffix')}</span> <span style="font-size:13px; font-weight:600; background:rgba(255,255,255,0.2); padding:3px 10px; border-radius:12px; margin-left:8px;">${stageTitle}</span></div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:28px; font-weight:900;">${lifePct}<span style="font-size:16px;">%</span></div>
            <div style="font-size:11px; opacity:0.85;">${this.t('expectedLife')} (${lifeBase}${this.t('ageSuffix')})</div>
          </div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${lifePct}%;"></div>
        </div>
      </div>

      <!-- MODERN SEGMENTED TABS (完全修復切邊) -->
      <div class="tabs-wrapper">
        ${tabsList.map(([k, label]) => `<div class="tab ${this.state.activeTab === k ? 'active' : ''}" onclick="App.changeTab('${k}')">${label}</div>`).join('')}
      </div>

      <!-- MAIN TAB CONTENT -->
      <div id="tab-content">${this.renderTabContent(p)}</div>
    </div>

    <!-- FLOATING ACTION BUTTON (QUICK ADD) -->
    <button class="fab-btn" title="${this.t('quickAdd')}" onclick="App.openQuickAddModal()">＋</button>
    `;
  },

  openQuickAddModal() {
    const tab = this.state.activeTab;
    if (tab === 'history' || tab === 'skills' || tab === 'achievements' || tab === 'diary' || tab === 'plans') {
        this.openModal(tab);
    } else {
        this.openModal('plans');
    }

  renderTabContent(p) {
    const tab = this.state.activeTab; const b = p.basic;
    const myId = this.state.loginProfileId;
    const isReadOnly = p.id !== myId && p.isClaimed === true;
    
    let topNotice = isReadOnly ? `<div style="background:#e0f2fe; color:#0369a1; padding:12px 16px; border-radius:var(--radius-sm); margin-bottom:18px; font-size:13px; font-weight:600; border:1px solid #bae6fd;">ℹ️ このプロフィールは共有受信中のため、閲覧および「期待」の追加のみ可能です。</div>` : '';

    if(tab === 'overview') {
      const totalHistory = p.history.length; const totalSkills = p.skills.length; const totalPlans = p.plans.length;
      const reachedPlans = p.plans.filter(pl => pl.status === 'completed').length;
      const successRate = totalPlans ? Math.round((reachedPlans / totalPlans) * 100) : 0;

      let html = topNotice + `
        <div class="grid-2" style="margin-bottom:20px;">
            <div>
                <div class="stats-grid" style="margin-bottom:0; height:100%; grid-template-columns: 1fr 1fr;">
                  <div class="stat-box"><div class="stat-val">${totalHistory}</div><div class="stat-label">${(this.data.settings.lang==='zh')?'學歷・經歷':'学歴・職歴'}</div></div>
                  <div class="stat-box"><div class="stat-val">${totalSkills}</div><div class="stat-label">${(this.data.settings.lang==='zh')?'證照・資格':'免許・資格'}</div></div>
                  <div class="stat-box"><div class="stat-val" style="color:var(--success);">${successRate}%</div><div class="stat-label">${(this.data.settings.lang==='zh')?'目標達成率':'目標達成率'}</div></div>
                  <div class="stat-box"><div class="stat-val">${totalPlans}</div><div class="stat-label">${(this.data.settings.lang==='zh')?'設定目標數':'設定プラン'}</div></div>
                </div>
            </div>
            <div class="card" style="margin-bottom:0; padding:16px;">
              <div style="font-size:13px; text-align:center; font-weight:700; color:var(--primary-dark); margin-bottom:6px;">${this.t('abilityParams')}</div>

            </div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>⏱️ ${(this.data.settings.lang==='zh')?'雙軌時間軸對比':'タイムライン対比'}</span>
          </div>

          <div class="timeline-filter-bar">
            ${[
              ['all', this.t('all')],
              ['history', this.t('filterHistory')],

              ['diary', this.t('filterDiary')]

      let items = [];

      (p.diary||[]).forEach(i => {
          const isOwner = i.author === myId;

      <div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">電話番号</label><input type="text" value="${b.phone||''}" onchange="App.updateBasic('phone', this.value)" ${isReadOnly ? 'disabled' : ''}></div><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">Email</label><input type="text" value="${b.email||''}" onchange="App.updateBasic('email', this.value)" ${isReadOnly ? 'disabled' : ''}></div></div>

      <div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">連絡先 郵便番号 (現住所と異なる場合)</label><input type="text" value="${b.contactPostalCode||''}" onchange="App.updateBasic('contactPostalCode', this.value)" ${isReadOnly ? 'disabled' : ''}></div><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">連絡先 住所</label><input type="text" value="${b.contactAddress||''}" onchange="App.updateBasic('contactAddress', this.value)" ${isReadOnly ? 'disabled' : ''}></div></div>
      <div class="grid-2"><div><label style="font-size:12px; font-weight:700; color:var(--text-sub);">連絡先 電話番号</label><input type="text" value="${b.contactPhone||''}" onchange="App.updateBasic('contactPhone', this.value)" ${isReadOnly ? 'disabled' : ''}></div><div></div></div>
      </div>`;
    }

    if(tab === 'history') return topNotice + this.buildListUI('history', this.t('history'), isReadOnly);
    if(tab === 'skills') return topNotice + this.buildListUI('skills', this.t('skills'), isReadOnly);
    if(tab === 'achievements') return topNotice + this.buildListUI('achievements', this.t('achievements'), isReadOnly);
    if(tab === 'diary') return topNotice + this.buildDiaryUI('diary', this.t('diary'), isReadOnly);
    
    if(tab === 'plans') {
        const requests = (p.plans||[]).filter(i => i.author === myId && i.visibility === 'requested');
        let reqHtml = ''; if(requests.length > 0) reqHtml = `<div class="card" style="background:#fff7ed; border-color:#fdba74;"><h3>承認待ちリクエスト</h3>${requests.map(r => `<div class="list-item"><div>${r.year}年: ${r.title}</div><button class="btn btn-success btn-sm" onclick="App.grantAccess('plans','${r.id}')">承認</button></div>`).join('')}</div>`;
        
        const renderP = (isTargetMyAuth) => {
            const filtered = (p.plans||[]).filter(i => (i.author === myId) === isTargetMyAuth);
            if(filtered.length === 0) return '<p style="text-align:center; font-size:13px; color:#999; padding:20px;">データなし</p>';
            return filtered.map(i => {
                const isOwner = i.author === myId; 
                if(isOwner || i.visibility === 'visible') {
                    const isCompleted = i.status === 'completed';
                    const canEdit = isOwner; 
                    const canComplete = !isCompleted && (isOwner || p.id === myId); 
                    
                    const compBtn = canComplete ? `<button class="btn btn-success btn-sm" onclick="event.stopPropagation(); App.triggerCompletePlan('${i.id}')">${(this.data.settings.lang==='zh'?'達成':'達成')}</button>` : '';
                    const visibilityBtn = isOwner ? `<button class="btn ${i.visibility === 'visible' ? 'btn-secondary' : 'btn-primary'} btn-sm" onclick="event.stopPropagation(); App.toggleVisibility('plans','${i.id}')">${i.visibility === 'visible' ? '🔓 公開中' : '🔒 非公開'}</button>` : '';
                    const titleUI = isCompleted ? `<span class="badge-success">${(this.data.settings.lang==='zh'?'已達成':'達成済')}</span> <strike style="color:#94a3b8;">${i.title}</strike>` : i.title;

                    return `<div class="list-item"><div class="item-content" ${canEdit?`onclick="App.openModal('plans','${i.id}')"`:''}><div class="item-meta">${i.year}年 <span class="tag" style="background:#64748b;">${i.stage}</span></div><div class="item-title">${titleUI}</div><div class="item-desc">${i.desc||''}</div></div><div style="display:flex; flex-direction:column; gap:6px; min-width:80px;">${visibilityBtn}${compBtn}${canEdit?`<button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); App.deleteItem('plans','${i.id}')">削除</button>`:''}</div></div>`;
                }
                return `<div class="list-item" style="align-items:center;"><div><span class="tag" style="background:#64748b;">${i.stage}</span> 🔒 内容非公開</div> <button class="btn btn-primary btn-sm" onclick="App.requestAccess('plans','${i.id}')">${i.visibility==='requested'?'要請中':'表示要請'}</button></div>`;
            }).join('');
        };

        let myTitle = ''; let otherTitle = '';
        let showAddMy = false;
        if (p.id === myId) {
            myTitle = this.t('myPlansTitle');
            otherTitle = this.t('parentExpectTitle'); 
            showAddMy = true;
        } else {
            myTitle = this.t('myExpectToChildTitle'); 
            otherTitle = this.t('childSelfGoalTitle');

        }
        
        return topNotice + reqHtml + `<div class="grid-2">
            <div class="card" style="border-top:4px solid var(--plan-my);">
                <div class="card-title"><span>${myTitle}</span> ${showAddMy ? `<button class="btn btn-primary btn-sm" onclick="App.openModal('plans')">+</button>` : ''}</div>

            <div class="card" style="border-top:4px solid var(--plan-parent);">
                <div class="card-title"><span>${otherTitle}</span></div>
                ${renderP(false)}
            </div>

    }

    if (tab === 'skilltree') {
        const isA = this.state.skillTreeMode === 'A';
